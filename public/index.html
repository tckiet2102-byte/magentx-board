/* ---------- booking nội bộ ---------- */
function intakeList(D){ return Object.keys(S.intake || {}).filter(k => S.intake[k] && S.intake[k].name).map(k => Object.assign({id: k}, S.intake[k])); }
function IntakeForm({D, id, me}){
  const b0 = id ? S.intake[id] : null;
  const [f, setF] = useState(() => b0 ? Object.assign({kindOther: ''}, b0, {est: b0.est ? String(b0.est) : ''}) : {name: '', kind: 'Content ads', kindOther: '', type: 'Internal', req: me ? nameOf(D, me)+(isReq(me) && S.staff[me].dept ? ', '+S.staff[me].dept : '') : '', brief: '', deliv: '', due: addDays(D.t, 7), links: '', est: '', prio: 'normal'});
  const set = (k, v) => setF(x => Object.assign({}, x, {[k]: v}));
  const ok = f.name.trim() && f.req.trim() && f.brief.trim() && f.due && (f.kind !== 'Khác' || f.kindOther.trim());
  const save = () => {
    if(!ok) return;
    if(f.links.trim() && !safeUrl(f.links.trim())){ toast('Link cần bắt đầu bằng http:// hoặc https://', 'warn'); return; }
    const o = {name: f.name.trim(), kind: f.kind === 'Khác' ? f.kindOther.trim() : f.kind, type: f.type, req: f.req.trim(), brief: f.brief.trim(), deliv: f.deliv.trim(), due: f.due, links: f.links.trim(), est: toInt(f.est) || 0, prio: f.prio};
    if(b0) intakeSave(id, o, 'sửa booking nội bộ "'+o.name+'"');
    else intakeSave(rid('in'), Object.assign(o, {status: 'new', by: me || null, at: Date.now()}), 'gửi booking nội bộ "'+o.name+'"');
    closeModal(); toast(b0 ? 'Đã lưu yêu cầu' : 'Đã gửi yêu cầu, chờ lead nhận');
  };
  const kinds = IN_KINDS.indexOf(f.kind) >= 0 ? f.kind : 'Khác';
  return html`<${Modal} title=${b0 ? 'Sửa yêu cầu nội bộ' : 'Gửi yêu cầu nội bộ'} onClose=${closeModal}>
    <form class="in-form" onSubmit=${e => { e.preventDefault(); save(); }}>
      <div class="field"><label class="lab" for="in-name">Tên việc</label><input id="in-name" class="inp" value=${f.name} placeholder="VD: Video showcase AI tháng 12" onInput=${e => set('name', e.target.value)}/></div>
      <div class="grid2 al-top">
        <div class="field"><label class="lab" for="in-kind">Loại việc</label><select id="in-kind" class="sel" value=${kinds} onChange=${e => set('kind', e.target.value)}>${IN_KINDS.map(k => html`<option key=${k} value=${k}>${k}</option>`)}</select>${kinds === 'Khác' ? html`<input class="inp" value=${f.kind === 'Khác' ? f.kindOther : (IN_KINDS.indexOf(f.kind) < 0 ? f.kind : f.kindOther)} placeholder="Ghi loại việc" aria-label="Loại việc khác" onInput=${e => setF(x => Object.assign({}, x, {kind: 'Khác', kindOther: e.target.value}))}/>` : null}</div>
        <div class="field"><label class="lab" for="in-type">Type trong Job Register</label><select id="in-type" class="sel" value=${f.type} onChange=${e => set('type', e.target.value)}>${REG_TYPES.map(t => html`<option key=${t} value=${t}>${t}</option>`)}</select></div>
      </div>
      <div class="grid2 al-top">
        <div class="field"><label class="lab" for="in-req">Người hoặc bộ phận yêu cầu</label><input id="in-req" class="inp" value=${f.req} placeholder="VD: Marketing, anh Minh" onInput=${e => set('req', e.target.value)}/></div>
        <div class="field"><label class="lab" for="in-due">Cần xong trước</label><input id="in-due" class="inp" type="date" value=${f.due} onInput=${e => set('due', e.target.value)}/></div>
      </div>
      <div class="field"><label class="lab" for="in-brief">Mô tả, brief</label><textarea id="in-brief" class="inp" rows="4" value=${f.brief} placeholder="Mục tiêu, nội dung chính, đối tượng xem, yêu cầu đặc biệt" onInput=${e => set('brief', e.target.value)}></textarea></div>
      <div class="grid2 al-top">
        <div class="field"><label class="lab" for="in-deliv">Bản giao<em class="opt-tag">không bắt buộc</em></label><input id="in-deliv" class="inp" value=${f.deliv} placeholder="VD: 3 video 30s, 9:16, có phụ đề" onInput=${e => set('deliv', e.target.value)}/></div>
        <div class="field"><label class="lab" for="in-est">Credit Higgsfield dự kiến<em class="opt-tag">không bắt buộc</em></label><input id="in-est" class="inp" inputmode="numeric" value=${f.est} placeholder="Tổng cho cả việc" onInput=${e => set('est', e.target.value.replace(/\D/g, ''))}/></div>
      </div>
      <div class="field"><label class="lab" for="in-links">Link brief, tham khảo<em class="opt-tag">không bắt buộc</em></label><input id="in-links" class="inp" type="url" value=${f.links} placeholder="https://…" onInput=${e => set('links', e.target.value)}/></div>
      <div class="field"><span class="lab">Mức ưu tiên</span><div class="seg" role="group" aria-label="Mức ưu tiên">${[['normal', 'Bình thường'], ['urgent', 'Gấp']].map(o => html`<button key=${o[0]} type="button" class=${f.prio === o[0] ? 'on' : ''} aria-pressed=${f.prio === o[0]} onClick=${() => set('prio', o[0])}>${o[1]}</button>`)}</div></div>
      <div class="form-foot"><span class=${ok ? 'good-t' : 'warn-t'}>${ok ? 'Đủ thông tin' : 'Cần tên việc, người yêu cầu, brief và hạn xong'}</span><span class="sp"></span><button type="button" class="btn" onClick=${closeModal}>Hủy</button><button type="submit" class="btn primary" disabled=${!ok}><${Ic} n="check"/>${b0 ? 'Lưu' : 'Gửi yêu cầu'}</button></div>
    </form>
  <//>`;
}
function IntakeCard({b, D, me}){
  const lead = canW() && isLead(D, me), mine = canW() && b.by === me;
  const [ask, setAsk] = useState(''), [reason, setReason] = useState('');
  const late = b.due && b.due < D.t;
  const take = () => openModal({type: 'project', pre: {useCase: 'INT', src: 'new', intake: b.id, name: b.name, type: b.type || 'Internal', pn: intakePname(b), seqOn: true,
    kindSel: b.kind === 'Content ads' ? 'ads' : b.kind === 'TVC khóa học' ? 'course' : 'other', kindOther: ['Content ads', 'TVC khóa học'].indexOf(b.kind) < 0 ? b.kind : '',
    start: D.t, deadline: b.due && b.due >= D.t ? b.due : addDays(D.t, 7), est: b.est || '', tier: 'C', duration: b.deliv || '',
    note: ['Yêu cầu: '+b.req, b.brief, b.deliv ? 'Bản giao: '+b.deliv : '', b.links || ''].filter(Boolean).join('\n')}});
  const decide = st => { intakeSave(b.id, {status: st, dBy: me || null, dAt: Date.now(), reason: reason.trim()}, (st === 'hold' ? 'hoãn' : 'từ chối')+' booking nội bộ "'+b.name+'"'+(reason.trim() ? ': '+reason.trim() : '')); setAsk(''); setReason(''); };
  return html`<article class=${'in-card'+(b.prio === 'urgent' ? ' urgent' : '')}>
    <div class="in-h"><h3>${b.name}</h3>${b.prio === 'urgent' ? html`<span class="st sm fix">Gấp</span>` : null}<span class="sp"></span><span class=${'in-due'+(late ? ' bad-t' : '')}>Cần trước <b>${fD(b.due)}</b>${late ? ', đã quá hạn' : ''}</span></div>
    <div class="in-tags"><span class="in-tag">${b.kind || 'Nội bộ'}</span>${b.type && b.type !== 'Internal' ? html`<span class="in-tag">${b.type}</span>` : null}<span class="meta">Yêu cầu: <b>${b.req}</b></span><span class="meta">${nameOf(D, b.by)}${isReq(b.by) && S.staff[b.by].dept ? ' ('+S.staff[b.by].dept+')' : ''} gửi ${rel(b.at)}</span></div>
    <p class="in-brief">${b.brief}</p>
    ${b.deliv || b.est || b.links ? html`<div class="in-extra">${b.deliv ? html`<span><span class="meta">Bản giao</span> ${b.deliv}</span>` : null}${b.est ? html`<span><span class="meta">Credit dự kiến</span> ${fN(b.est)}</span>` : null}${safeUrl(b.links) ? html`<a href=${b.links} target="_blank" rel="noopener"><${Ic} n="ext" s=${14}/>Link brief</a>` : null}</div>` : null}
    ${b.status !== 'new' && b.reason ? html`<p class="meta">${IN_STATUS[b.status]} bởi ${nameOf(D, b.dBy)}: ${b.reason}</p>` : null}
    ${ask ? html`<div class="in-ask"><input class="inp sm" value=${reason} placeholder=${ask === 'hold' ? 'Lý do hoãn, VD chờ brief đầy đủ' : 'Lý do từ chối'} aria-label="Lý do" onInput=${e => setReason(e.target.value)}/><button type="button" class=${'btn sm'+(ask === 'declined' ? ' danger' : '')} onClick=${() => decide(ask)}>${ask === 'hold' ? 'Hoãn' : 'Từ chối'}</button><button type="button" class="btn sm" onClick=${() => setAsk('')}>Thôi</button></div>`
      : html`<div class="acts">
        ${lead && b.status !== 'assigned' ? html`<button type="button" class="btn sm primary" onClick=${take}><${Ic} n="check" s=${16}/>Nhận và giao việc</button>` : null}
        ${lead && b.status === 'new' ? html`<button type="button" class="btn sm" onClick=${() => setAsk('hold')}>Hoãn</button><button type="button" class="btn sm" onClick=${() => setAsk('declined')}>Từ chối</button>` : null}
        ${(mine || lead) && b.status === 'new' ? html`<button type="button" class="btn sm" onClick=${() => openModal({type: 'intake', id: b.id})}><${Ic} n="edit" s=${16}/>Sửa</button>` : null}
        ${lead && b.status !== 'new' && b.status !== 'assigned' ? html`<button type="button" class="btn sm" onClick=${() => intakeSave(b.id, {status: 'new', reason: ''}, 'mở lại booking nội bộ "'+b.name+'"')}>Mở lại</button>` : null}
      </div>`}
  </article>`;
}
function IntakeView({D, me}){
  const lead = isLead(D, me), req = isReq(me);
  const all = intakeList(D).filter(b => !req || b.by === me);
  const byDue = (a, b) => (b.prio === 'urgent') - (a.prio === 'urgent') || String(a.due).localeCompare(String(b.due));
  const fresh = all.filter(b => b.status === 'new').sort(byDue);
  const done = all.filter(b => b.status === 'assigned').sort((a, b) => (b.aAt || 0) - (a.aAt || 0));
  const parked = all.filter(b => b.status === 'hold' || b.status === 'declined').sort((a, b) => (b.dAt || 0) - (a.dAt || 0));
  const [showPark, setShowPark] = useState(false);
  return html`
    <div class="ph"><div><h1>Booking nội bộ</h1><p>${req ? 'Gửi yêu cầu việc cho phòng Production và theo dõi tình trạng. Hào hoặc Hiếu sẽ nhận, chọn người làm và hạn giao.' : html`Nhận việc nội bộ, lập dự án và giao người làm. Mỗi yêu cầu được nhận thành một job <span class="code">YYMM_MX_…</span> trong Job Register.`}</p></div>
      ${canW() ? html`<button type="button" class="btn primary" onClick=${() => openModal({type: 'intake'})}><${Ic} n="plus" s=${18}/>Gửi yêu cầu</button>` : null}</div>
    <ol class="in-flow" aria-label="Các bước">
      <li><b>Gửi yêu cầu</b><span>Ai cũng gửi được: tên việc, người yêu cầu, brief, hạn xong, bản giao.</span></li>
      <li><b>Lead nhận và giao việc</b><span>${lead ? 'Bạn' : 'Hào hoặc Hiếu'} chọn quy trình, người làm, thời gian. Bảng tạo dự án và Job ID.</span></li>
      ${req ? html`<li><b>Theo dõi</b><span>Yêu cầu chuyển sang Đã giao kèm người làm, hạn giao và tiến độ. Bị hoãn hay từ chối thì có lý do.</span></li>` : html`<li><b>Vào Job Register</b><span>${S.reg.state === 'ok' ? 'Bảng tự thêm dòng job MX vào sheet.' : 'Copy ba khối ô vào sheet, rồi bấm Đã nhập xong.'} Tạo folder bằng menu MagentX.</span></li>`}
    </ol>
    <section class="panel flush" aria-label="Chờ nhận">
      <div class="panel-h"><h2>${req ? 'Đang chờ nhận' : 'Chờ nhận'} <span class=${'badge-n'+(fresh.length ? ' wait' : '')}>${fresh.length}</span></h2></div>
      ${fresh.length ? html`<div class="in-list">${fresh.map(b => html`<${IntakeCard} key=${b.id} b=${b} D=${D} me=${me}/>`)}</div>` : html`<div class="in-empty"><p class="empty">${req ? 'Bạn chưa có yêu cầu nào đang chờ.' : 'Không có yêu cầu nào đang chờ.'}${canW() ? ' Bấm Gửi yêu cầu khi có việc nội bộ mới.' : ''}</p></div>`}
    </section>
    <section class="panel flush" aria-label="Đã giao">
      <div class="panel-h"><h2>Đã giao <span class="badge-n">${done.length}</span></h2></div>
      ${done.length ? html`<ul class="in-done">${done.slice(0, 30).map(b => { const p = D.pmap[b.pid]; return html`<li key=${b.id}>
          <div class="in-done-h"><b>${p && !req ? html`<a href=${'#job-'+p.id}>${p.name}</a>` : p ? p.name : b.name}</b>${(p && p.code) || b.code ? html`<span class="code meta">${(p && p.code) || b.code}</span>` : null}${p && p.closed ? html`<span class="st sm done">${P_STATUS[p.status]}</span>` : null}</div>
          <div class="in-tags"><span class="meta">Yêu cầu: ${b.req}</span>${p ? html`<span class="meta">Người làm: ${req ? p.steps.length ? Array.from(new Set([].concat.apply([], p.steps.map(x => x.who)))).map(w => nameOf(D, w)).join(', ') || b.team : (b.team || nameOf(D, p.pic)) : teamText(D, p)}</span><span class="meta">${p.steps.length ? 'Xong '+p.doneN+'/'+p.total+' bước'+(p.cur ? ', đang ở bước '+p.cur.def.no+' '+p.cur.def.name : '') : P_STATUS[p.status]}, hạn giao ${fD(p.deadline)}</span>` : b.team ? html`<span class="meta">Người làm: ${b.team}</span><span class="meta">Hạn giao ${fD(b.deadline)}</span>` : html`<span class="meta">Dự án đã bị xóa</span>`}<span class="meta">${nameOf(D, b.aBy)} giao ${rel(b.aAt)}</span></div>
          ${p && !req ? html`<${RegBox} p=${p} D=${D}/>` : null}
        </li>`; })}</ul>` : html`<div class="in-empty"><p class="empty">Chưa giao yêu cầu nào.</p></div>`}
    </section>
    ${parked.length ? html`<section class="panel flush" aria-label="Tạm hoãn, từ chối">
      <div class="panel-h"><h2>Tạm hoãn, từ chối <span class="badge-n">${parked.length}</span></h2>${req ? null : html`<button type="button" class="btn xs" aria-expanded=${showPark} onClick=${() => setShowPark(!showPark)}>${showPark ? 'Thu gọn' : 'Xem'}</button>`}</div>
      ${showPark || req ? html`<div class="in-list">${parked.map(b => html`<${IntakeCard} key=${b.id} b=${b} D=${D} me=${me}/>`)}</div>` : null}
    </section>` : null}`;
}

/* ---------- app ---------- */
function NoDb(){
  return html`<div class="empty"><b>Chưa kết nối được database.</b><span>${window.__mxDbError === 'config' ? 'Chưa dán cấu hình Firebase (FIREBASE_CONFIG) vào file index.html.' : 'Kiểm tra kết nối mạng rồi tải lại trang. Nếu vẫn lỗi, báo người quản lý bảng.'}</span><a class="btn" href="#dat-ten">Mở trang Đặt tên file</a></div>`;
}
function ModalHost({D, me}){
  const m = S.modal; if(!m) return null;
  if(m.type === 'project') return html`<${ProjectForm} key=${m.pid || 'new'} D=${D} pid=${m.pid} pre=${m.pre}/>`;
  if(m.type === 'intake') return html`<${IntakeForm} key=${m.id || 'new'} D=${D} id=${m.id} me=${me}/>`;
  if(m.type === 'identity') return html`<${IdentityModal} D=${D} me=${me}/>`;
  if(m.type === 'account') return html`<${AccountForm} key=${m.aid || 'new'} D=${D} aid=${m.aid}/>`;
  if(m.type === 'review') return html`<${ReviewPlayer} key=${m.pid+'/'+m.sid} D=${D} pid=${m.pid} sid=${m.sid} me=${me}/>`;
  return null;
}
function App(){
  useStore();
  const route = useRoute();
  const D = useMemo(derive, [S.v]);
  const me = meId();
  useEffect(() => {
    if(S.localMe){
      const ss = sessGet();
      if(!ss || ss.staff !== S.localMe) logout('Phiên đăng nhập đã hết hạn. Nhập lại mã PIN để tiếp tục.');
      else if(S.got.staff){ const st = S.staff[S.localMe]; if(st && st.active === false && st.kind === 'req') logout('Tài khoản này đang bị khóa. Hỏi Hào để mở lại.'); else if(!st || !hasPin(S.localMe) || (st.pin.at || 0) !== ss.pv) logout('Mã PIN của tài khoản này vừa được đổi hoặc đặt lại. Đăng nhập lại.'); }
    }
    if(S.phase === 'ready' && S.got.staff && !meId() && !S.idAsked && D.staffList.length && !S.modal){ S.idAsked = true; openModal({type: 'identity'}); }
  });
  useEffect(() => { const t = setInterval(() => { if(S.localMe && !sessGet()) logout('Phiên đăng nhập đã hết hạn. Nhập lại mã PIN để tiếp tục.'); }, 60000); return () => clearInterval(t); }, []);
  useEffect(() => { if(route.view !== 'job') window.scrollTo(0, 0); }, [route.view]);
  const req = isReq(me);
  useEffect(() => { if(me && !req && S.phase === 'ready') regLoad(); }, [me, route.view, S.phase]);
  useEffect(() => { if(req && route.view !== 'noi-bo') location.hash = 'noi-bo'; }, [req, route.view]);
  const free = route.view === 'dat-ten';
  let view;
  if(!free && S.phase === 'nodb') view = html`<${NoDb}/>`;
  else if(!free && S.phase === 'ready' && !me) view = html`<div class="boot"><div class="boot-card"><b>Đăng nhập để xem bảng</b><span>Chọn tên của bạn và nhập mã PIN 4 số. Phòng ban khác cần đặt việc nội bộ thì tạo tài khoản mới.</span><button type="button" class="btn primary" onClick=${() => openModal({type:'identity'})}><${Ic} n="user" s=${16}/>Đăng nhập</button></div></div>`;
  else if(req) view = html`<${IntakeView} D=${D} me=${me}/>`;
  else if(!free && (S.phase === 'boot' || !S.firstData)) view = html`<div class="boot"><div class="boot-card"><b>Đang tải dữ liệu phòng…</b><span>Lịch, dự án và credit Higgsfield.</span></div></div>`;
  else if(route.view === 'du-an') view = html`<${ProjectsView} D=${D}/>`;
  else if(route.view === 'qc') view = html`<${QCView} D=${D} me=${me}/>`;
  else if(route.view === 'credit') view = html`<${CreditView} D=${D} me=${me}/>`;
  else if(route.view === 'dat-ten') view = html`<${NamingView} D=${D}/>`;
  else if(route.view === 'cai-dat') view = html`<${SettingsView} D=${D} me=${me}/>`;
  else if(route.view === 'nhat-ky') view = html`<${LogView} D=${D} me=${me}/>`;
  else if(route.view === 'noi-bo') view = html`<${IntakeView} D=${D} me=${me}/>`;
  else if(route.view === 'job') view = html`<${ProjectDetail} key=${route.id} D=${D} id=${route.id} me=${me}/>`;
  else view = html`<${CalendarView} D=${D} me=${me}/>`;
  return html`
    <${TopBar} D=${D} route=${route} me=${me}/>
    <main class="wrap">
      ${S.stale ? html`<div class="banner warn">Chưa tải được dữ liệu mới nhất, có thể đang mất kết nối. Những gì đang hiện có thể chưa cập nhật.</div>` : null}
      ${false ? html`<div class="banner login-banner"><span>Bạn đang xem, chưa đăng nhập. Đăng nhập để tạo dự án, nộp link, duyệt QC.</span><button type="button" class="btn sm primary" onClick=${() => openModal({type:'identity'})}><${Ic} n="user" s=${16}/>Đăng nhập</button></div>` : null}
      ${S.readOnly && S.phase === 'ready' ? html`<div class="banner">Bạn đang ở chế độ chỉ xem. Database đang chặn quyền ghi, báo người quản lý bảng kiểm tra Firestore Rules.</div>` : null}
      ${view}
    </main>
    <${ModalHost} D=${D} me=${me}/>
    <${Toasts}/>`;
}

const root = document.getElementById('app');
root.textContent = '';
render(html`<${App}/>`, root);
boot();
})();
</script>
