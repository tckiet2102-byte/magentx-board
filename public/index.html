<title>MagentX Production Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: top bar (tabs + one blue "Tạo dự án") over a 1320px column; each page = large title row, then sections.
   Hierarchy: action = button with icon (blue fill for the main one, outlined for the rest, green for approve);
   input = white field, 1.5px border, bold label above; information = plain text in two sizes. Nothing else gets a box.
   One loud element: the "today" column runs as a blue band through the whole month board. */
:root{
  --paper:#f2f4f8; --surface:#ffffff; --subtle:#f7f8fb; --tint:#eceff6;
  --ink:#171b2e; --ink-2:#4b5369; --ink-3:#7c8396;
  --rule:#e0e4ed; --field:#b3bbcc; --field-hover:#8a93a8;
  --action:#2347d6; --action-hover:#1a39b6; --action-soft:#e4eaff; --on-action:#ffffff;
  --ok:#1b8448; --ok-soft:#e1f3e8; --wait:#9a5900; --wait-soft:#fff1d6; --bad:#c3342b; --bad-soft:#fde8e6; --on-wait:#2a1d00;
  --d-todo:#a9b1c1; --d-doing:#3c73e0; --d-review:#e0a000; --d-fix:#d6423a; --d-done:#2e9c59;
  --c-todo:#e3e7ee; --c-doing:#cddafb; --c-review:#fbe4ab; --c-fix:#f9cdc8; --c-done:#cfeedb; --c-nopipe:#e8ebf1;
  --heat1:#e8eefc; --heat2:#c6d6f8; --heat3:#f8cfca;
  --shadow:0 14px 44px rgb(23 27 46 / .2);
  --scrim:rgb(15 18 30 / .46);
  --f:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --namew:240px; --dayw:32px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1219; --surface:#171b25; --subtle:#1b2030; --tint:#232a3b;
    --ink:#eceff6; --ink-2:#aeb5c7; --ink-3:#808899;
    --rule:#2a3142; --field:#4c5672; --field-hover:#6a7594;
    --action:#7c9dff; --action-hover:#98b2ff; --action-soft:#1f2b4d; --on-action:#0f1219;
    --ok:#5ccf8a; --ok-soft:#173523; --wait:#f0bd5a; --wait-soft:#3a2d10; --bad:#ff7d73; --bad-soft:#40201e; --on-wait:#2a1d00;
    --d-todo:#626e84; --d-doing:#6f9bff; --d-review:#e5ad2e; --d-fix:#ff6b62; --d-done:#4cc27d;
    --c-todo:#262e3d; --c-doing:#213a6e; --c-review:#4d3c13; --c-fix:#522523; --c-done:#193f2a; --c-nopipe:#232b39;
    --heat1:#1b2643; --heat2:#27427f; --heat3:#5d2824;
    --shadow:0 14px 44px rgb(0 0 0 / .55);
    --scrim:rgb(0 0 0 / .62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1219; --surface:#171b25; --subtle:#1b2030; --tint:#232a3b;
  --ink:#eceff6; --ink-2:#aeb5c7; --ink-3:#808899;
  --rule:#2a3142; --field:#4c5672; --field-hover:#6a7594;
  --action:#7c9dff; --action-hover:#98b2ff; --action-soft:#1f2b4d; --on-action:#0f1219;
  --ok:#5ccf8a; --ok-soft:#173523; --wait:#f0bd5a; --wait-soft:#3a2d10; --bad:#ff7d73; --bad-soft:#40201e; --on-wait:#2a1d00;
  --d-todo:#626e84; --d-doing:#6f9bff; --d-review:#e5ad2e; --d-fix:#ff6b62; --d-done:#4cc27d;
  --c-todo:#262e3d; --c-doing:#213a6e; --c-review:#4d3c13; --c-fix:#522523; --c-done:#193f2a; --c-nopipe:#232b39;
  --heat1:#1b2643; --heat2:#27427f; --heat3:#5d2824;
  --shadow:0 14px 44px rgb(0 0 0 / .55);
  --scrim:rgb(0 0 0 / .62);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--f);-webkit-font-smoothing:antialiased}
a{color:var(--action);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--action);outline-offset:2px}
h1{margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
h3{margin:0;font-size:17px;line-height:1.35;font-weight:700}
h4{margin:0;font-size:15px;line-height:1.4;font-weight:700}
p{margin:0}
.meta{font-size:13.5px;color:var(--ink-2)}
.faint{color:var(--ink-3)}
.code{font-family:var(--f-code);font-weight:600;letter-spacing:-.01em}
.bad-t{color:var(--bad)}
.warn-t{color:var(--wait)}
.good-t{color:var(--ok)}
.nw{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.top-in{max-width:1320px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:24px;height:66px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand .sub{font-weight:500;color:var(--ink-2)}
.nav{display:flex;align-self:stretch;gap:2px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{position:relative;display:flex;align-items:center;gap:8px;padding:0 13px;font-size:15px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.nav a:hover{color:var(--ink);text-decoration:none;background:var(--subtle)}
.nav a.on{color:var(--ink);font-weight:700}
.nav a.on::after{content:"";position:absolute;left:13px;right:13px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--action)}
.cnt{display:inline-block;min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--d-review);color:var(--on-wait);font-size:12px;font-weight:800;line-height:21px;text-align:center}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
@media (max-width:1000px){
  .top-in{flex-wrap:wrap;height:auto;gap:0 10px;padding-block:8px 0}
  .brand{flex:1 1 auto;min-height:46px}
  .nav{order:3;flex-basis:100%;height:48px;margin-inline:-8px}
}
@media (max-width:560px){.brand .sub{display:none}.top-r .who-name{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1.5px solid var(--field);background:var(--surface);color:var(--ink);font:600 15px/1 var(--f);cursor:pointer;white-space:nowrap;text-decoration:none;transition:background-color .12s,border-color .12s}
.btn svg{flex:none}
.btn:hover{background:var(--tint);border-color:var(--field-hover);text-decoration:none}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:disabled:hover{background:var(--surface);border-color:var(--field)}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--on-action)}
.btn.primary:hover{background:var(--action-hover);border-color:var(--action-hover)}
.btn.primary:disabled:hover{background:var(--action);border-color:var(--action)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-action)}
.btn.ok:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in oklab,var(--bad) 55%,var(--field))}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{height:36px;padding:0 13px;font-size:14px;gap:7px;border-radius:9px}
.btn.xs{height:30px;padding:0 10px;font-size:13.5px;gap:6px;border-radius:8px;border-width:1px}
.btn.lg{height:46px;padding:0 22px;font-size:16px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border-radius:10px;border:1.5px solid var(--field);background:var(--surface);color:var(--ink);cursor:pointer}
.icon-btn:hover{background:var(--tint);border-color:var(--field-hover);text-decoration:none}
.icon-btn.sm{width:30px;height:30px;border-radius:8px;border-width:1px}
.icon-btn.bare{border-color:transparent;background:transparent;color:var(--ink-2)}
.icon-btn.bare:hover{background:var(--tint);color:var(--ink)}
.icon-btn.on{color:var(--action);background:var(--action-soft);border-color:transparent}

/* inputs */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field > .lab{font-size:14px;font-weight:700;color:var(--ink)}
.field > .hint{font-size:13px;color:var(--ink-2)}
.inp,.sel{height:44px;width:100%;min-width:0;padding:0 12px;border:1.5px solid var(--field);border-radius:10px;background:var(--surface);color:var(--ink);font:400 15px var(--f)}
textarea.inp{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}
.inp:hover,.sel:hover{border-color:var(--field-hover)}
.inp:focus,.sel:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 3px var(--action-soft)}
.inp::placeholder{color:var(--ink-3)}
.inp.sm,.sel.sm{height:36px;font-size:14px;padding:0 10px;border-radius:9px}
.inp.code{font-family:var(--f-code);font-weight:500}
.inp:disabled,.sel:disabled{background:var(--tint);border-color:var(--rule);color:var(--ink-2)}
.sel.auto{width:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.check{display:inline-flex;align-items:center;gap:10px;min-height:32px;font-size:15px;color:var(--ink);cursor:pointer}
.check input{width:19px;height:19px;margin:0;flex:none;accent-color:var(--action);cursor:pointer}
.check.al-top{align-items:flex-start}
.check.al-top input{margin-top:2px}
.checks{display:flex;flex-wrap:wrap;gap:4px 22px}
.checks.col{flex-direction:column;gap:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--field);border-radius:12px;background:var(--surface);cursor:pointer}
.opt:hover{border-color:var(--field-hover);background:var(--subtle)}
.opt input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--action);cursor:pointer}
.opt b{display:block;font-size:15px;font-weight:700}
.opt small{display:block;font-size:13px;line-height:1.4;color:var(--ink-2)}
.opt.on{border-color:var(--action);background:var(--action-soft)}
.opt.dis{opacity:.5;cursor:not-allowed}
.opt:focus-within{outline:2.5px solid var(--action);outline-offset:2px}
.seg{display:inline-flex;padding:4px;gap:4px;border-radius:12px;background:var(--tint)}
.seg button{height:36px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:var(--ink-2);font:600 14.5px var(--f);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .14)}
.seg button:disabled{opacity:.45;cursor:not-allowed}

/* status: coloured dot + word */
.st{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--dot);flex:none}
.st.todo{color:var(--ink-3);--dot:var(--d-todo)}
.st.doing{color:var(--ink);--dot:var(--d-doing)}
.st.review{color:var(--wait);--dot:var(--d-review)}
.st.fix{color:var(--bad);--dot:var(--d-fix)}
.st.done{color:var(--ok);--dot:var(--d-done)}
.st.sm{font-size:13px}

/* page frame */
.wrap{max-width:1320px;margin:0 auto;padding-block:30px 84px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap}
.ph p{margin-top:8px;max-width:68ch;color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel.flush{padding:0;overflow:hidden;gap:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.panel.flush > .panel-h{padding:18px 22px 14px}
.banner{padding:12px 16px;border-radius:12px;background:var(--action-soft);font-size:14.5px}
.banner.warn{background:var(--wait-soft)}
.empty{padding:20px;border:1.5px dashed var(--field);border-radius:14px;color:var(--ink-2);font-size:15px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.boot{min-height:46vh;display:flex;align-items:center;justify-content:center;padding:24px}
.boot-card{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;color:var(--ink-2)}
.boot-card b{color:var(--ink);font-size:17px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.lg{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:13px;border-radius:4px;display:inline-block;flex:none}
.sw.todo{background:var(--c-todo)} .sw.doing{background:var(--c-doing)} .sw.review{background:var(--c-review)} .sw.fix{background:var(--c-fix)} .sw.done{background:var(--c-done)}
.sw.late{background:var(--surface);box-shadow:inset 0 0 0 2px var(--d-fix)}
.sw.dl{width:3px;height:16px;background:var(--d-fix);border-radius:2px}
.sw.today{background:color-mix(in oklab,var(--action) 14%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--action)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:13px;font-weight:600;color:var(--ink-2);padding:11px 16px;background:var(--subtle);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right}
.tbl td.bad{color:var(--bad);font-weight:700}
.tbl td.strong{font-weight:700}
.tbl .cell-actions{margin-top:8px}

/* attention row */
.attn{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.attn .btn{gap:9px}
.badge-n{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:12px;font-size:13px;font-weight:800;background:var(--tint);color:var(--ink)}
.badge-n.wait{background:var(--d-review);color:var(--on-wait)}
.badge-n.bad{background:var(--bad);color:var(--on-action)}
.calm{font-size:15px;color:var(--ink-2)}

/* month board */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.mnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mnav h1{min-width:205px;text-align:center}
.board{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:16px}
.cal{min-width:calc(var(--namew) + var(--nd) * var(--dayw))}
.crow{display:grid;grid-template-columns:var(--namew) repeat(var(--nd),minmax(var(--dayw),1fr))}
.cname{position:sticky;left:0;z-index:3;grid-column:1;background:var(--surface);border-right:1px solid var(--rule);padding:10px 16px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.dhead{border-bottom:1.5px solid var(--field)}
.dhead .cname{justify-content:flex-end;font-size:13px;font-weight:600;color:var(--ink-2)}
.dh{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-block:8px;border-left:1px solid var(--rule)}
.dh b{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.dh small{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.dh.we{background:var(--subtle)}
.dh.td{background:color-mix(in oklab,var(--action) 12%,var(--surface));box-shadow:inset 1.5px 0 0 var(--action),inset -1.5px 0 0 var(--action)}
.dh.td b{background:var(--action);color:var(--on-action)}
.dh.td small{color:var(--action);font-weight:800}
.pblock{border-top:1.5px solid var(--field)}
.pblock:first-of-type{border-top:0}
.phead{grid-template-rows:minmax(54px,auto);background:var(--subtle)}
.phead .cname{background:var(--subtle)}
.pn{font-size:16px;font-weight:800}
.cname small{font-size:13px;color:var(--ink-2);line-height:1.35}
.you{font-size:13px;font-weight:700;color:var(--action)}
.heat{grid-row:1;border:0;border-left:1px solid var(--rule);background:transparent;font:700 13px/1 var(--f);font-variant-numeric:tabular-nums;color:var(--ink-2);cursor:pointer;padding:0;min-width:0}
.heat.we{background:var(--tint)}
.heat.l1{background:var(--heat1);color:var(--ink)}
.heat.l2{background:var(--heat2);color:var(--ink)}
.heat.l3{background:var(--heat3);color:var(--bad);font-weight:800}
.heat.off{background:repeating-linear-gradient(135deg,var(--rule) 0 3px,transparent 3px 7px);font:600 11px/1 var(--f);color:var(--ink-2)}
.heat.td{box-shadow:inset 1.5px 0 0 var(--action),inset -1.5px 0 0 var(--action)}
.heat:hover{outline:2px solid var(--field-hover);outline-offset:-2px}
.sub{border-top:1px solid var(--rule)}
.sub .cname{padding-left:30px}
.sub.proj .cname{padding-left:16px}
.pname{font-size:14.5px;font-weight:600;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.pname:hover{color:var(--action)}
.cday{border-left:1px solid var(--rule)}
.cday.we{background:var(--subtle)}
.cday.off{background:repeating-linear-gradient(135deg,var(--tint) 0 4px,transparent 4px 8px)}
.cday.td{background:color-mix(in oklab,var(--action) 7%,var(--surface));box-shadow:inset 1.5px 0 0 var(--action),inset -1.5px 0 0 var(--action)}
.dlx{z-index:2;justify-self:end;width:3px;margin-right:-2px;background:var(--d-fix);border-radius:2px}
.sb{position:relative;z-index:1;align-self:center;height:28px;margin:0 2px;padding:0 6px;border:0;border-radius:7px;background:var(--c-todo);color:var(--ink);font:600 13px/28px var(--f);text-align:left;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:0}
.sb.doing{background:var(--c-doing)}
.sb.review{background:var(--c-review)}
.sb.fix{background:var(--c-fix)}
.sb.done{background:var(--c-done);color:var(--ink-2)}
.sb.nopipe{background:repeating-linear-gradient(135deg,var(--c-nopipe) 0 6px,transparent 6px 12px);color:var(--ink-3);font-weight:500;box-shadow:inset 0 0 0 1px var(--field)}
.sb.late{box-shadow:inset 0 0 0 2px var(--d-fix)}
.sb:hover{filter:brightness(.94)}
.sb.cutl{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.sb.cutr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.sbx{position:relative;z-index:1;align-self:center;display:flex;align-items:center;gap:6px;height:28px;min-width:0;padding:0;border:0;background:transparent;color:var(--ink);font:600 13px/28px var(--f);text-align:left;white-space:nowrap;cursor:pointer}
.sbx.l{justify-content:flex-end}
.sbx.done{color:var(--ink-2)}
.sbx > span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sbx:hover > span{text-decoration:underline;text-underline-offset:3px}
.sbx:hover .sbar{filter:brightness(.94)}
.sbar{position:relative;flex:0 0 auto;display:flex;height:28px;margin:0 2px;border-radius:7px;overflow:hidden}
.sbar b{flex:1 1 0;background:var(--c-todo)}
.sbar b.doing{background:var(--c-doing)}
.sbar b.review{background:var(--c-review)}
.sbar b.fix{background:var(--c-fix)}
.sbar b.done{background:var(--c-done)}
.sbar em{position:absolute;inset:0;padding:0 6px;font-style:normal;overflow:hidden;text-overflow:ellipsis}

function accMetrics(a, bookings, t, cfg){
  const rd = Math.min(31, Math.max(1, toInt(a.resetDay) || 1));

  const unlogged = balOk ? Math.max(0, base - (+a.balance) - used) : 0;

function bookingCheck(b, ctx){
  const a = ctx.amap[b.acc];
  if(!(b.est > 0)) return {k:'THIẾU ƯỚC LƯỢNG'};
  if(!b.date) return {k:'THIẾU NGÀY BOOK'};
  if(!a) return {k:'CHƯA CHỌN ACC'};
  const per = periodFor(a.m.rd, b.date);
  b.per = per;
  const list = ctx.bookings.filter(x => x.acc === a.id && x.date && x.date >= per.start && x.date < per.end).sort(cmpBooking);
  let cum = 0; for(const x of list){ cum += reservedOf(x); if(x.pid === b.pid && x.bid === b.bid) break; }
  b.cum = cum;
  if(b.status === 'done') return {k:'ĐÃ XONG'};
  if(b.status === 'cancelled') return {k:'ĐÃ HỦY'};
  if(a.scope === 'ext' && b.p.useCase === 'INT') return {k:'ACC CHỈ CHO EXT'};
  if(per.end <= ctx.t) return {k:'QUA KỲ RESET'};
  const isCur = per.start === a.m.per.start;
  const cap = (+a.perPeriod || 0) + (isCur ? a.m.topup : 0) - ctx.cfg.buffer;
  if(cum + (isCur ? a.m.unlogged : 0) > cap) return {k:'VƯỢT CAP'};

}
function suggestAcc(D, useCase, need, date, excl){

    const isCur = per.start === a.m.per.start;
    const list = D.bookings.filter(x => x.acc === a.id && x.date && x.date >= per.start && x.date < per.end && !(excl && x.pid === excl.pid && x.bid === excl.bid));
    const cap = (+a.perPeriod || 0) + (isCur ? a.m.topup : 0) - D.cfg.buffer;
    const room = cap - sum(list.map(reservedOf)) - (isCur ? a.m.unlogged : 0);

/* ---------- date range picker ---------- */
const WD_LONG = ['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
function addMonths(ym, k){ const d = new Date(+ym.slice(0,4), +ym.slice(5,7) - 1 + k, 1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }

  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  const cells = []; for(let i = 0; i < lead; i++) cells.push(null);
  const nd = monthDays(y, m); for(let d = 1; d <= nd; d++) cells.push(ym+'-'+pad(d));
  while(cells.length % 7) cells.push(null);
  return cells;
}
function DateRange({start, end, onChange, labels}){
  const L = labels || ['Bắt đầu', 'Kết thúc'];

  const [draft, setDraft] = useState({s: start || '', e: end || ''});

  const ref = useRef(null); const popRef = useRef(null);
  useEffect(() => { if(!open) setDraft({s: start || '', e: end || ''}); }, [start, end, open]);
  useEffect(() => { if(open && popRef.current && popRef.current.scrollIntoView) popRef.current.scrollIntoView({block: 'nearest'}); }, [!!open]);
  const commit = (s, e) => { if(s && e && (s !== (start || '') || e !== (end || ''))) onChange(s, e); };
  const close = () => { if(draft.s) commit(draft.s, draft.e || draft.s); setOpen(null); setHover(''); };
  const closeRef = useRef(close); closeRef.current = close;
  useEffect(() => {
    if(!open) return;
    const onDown = ev => { if(ref.current && !ref.current.contains(ev.target)) closeRef.current(); };
    const onKey = ev => { if(ev.key === 'Escape'){ ev.stopPropagation(); closeRef.current(); } };
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey, true);
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey, true); };
  }, [open]);
  const openAt = which => {
    setDraft({s: start || '', e: end || ''});
    let v = (start || end || today()).slice(0,7);
    if(which === 'end' && end && end.slice(0,7) > addMonths(v, 1)) v = addMonths(end.slice(0,7), -1);
    setView(v); setHover(''); setOpen(which);
  };
  const pick = d => {
    if(open === 'start' || !draft.s){
      const e = draft.e && draft.e >= d ? draft.e : '';
      setDraft({s: d, e}); setOpen('end');
      if(e) commit(d, e);
    } else if(d < draft.s){
      setDraft({s: d, e: ''});

    <div class="drp-fields">

      <span class="drp-sep" aria-hidden="true"><${Ic} n="right" s=${18}/></span>
      <button type="button" class=${'drp-field'+(open === 'end' ? ' on' : '')} aria-expanded=${open === 'end'} onClick=${() => open === 'end' ? close() : openAt('end')}><span><${Ic} n="cal" s=${14}/>${L[1]}</span><b class=${shownE ? '' : 'empty'}>${fmt(shownE)}</b></button>
    </div>
    ${!open && n ? html`<span class="hint">${n} ngày, gồm ${workDays(shownS, shownE)} ngày làm việc</span>` : null}
    ${open ? html`<div class="drp-pop" ref=${popRef} role="dialog" aria-label=${'Chọn '+which.toLowerCase()}>
      <div class="drp-head">
        <button type="button" class="icon-btn sm" aria-label="Tháng trước" onClick=${() => setView(addMonths(view, -1))}><${Ic} n="left" s=${16}/></button>
        <b>Chọn ${which.toLowerCase()}</b>

        </div>`)}
      </div>

    </div>` : null}
  </div>`;
}

/* ---------- month board ---------- */
function mkItem(p, st, a, b, mStart, mEnd, nd){ return {p, st, a: Math.max(0, diffDays(mStart, a)), b: Math.min(nd-1, diffDays(mStart, b)), cutL: a < mStart, cutR: b > mEnd}; }
function spanOf(p, t){ if(!p.start || !p.deadline) return null; const a = p.start <= p.deadline ? p.start : p.deadline; let b = p.start <= p.deadline ? p.deadline : p.start; if(p.late && t > b) b = t; return [a, b]; }
function buildPeople(D, days, mStart, mEnd, dw){
  const nd = days.length;
  return D.staffList.filter(s => s.active !== false).map(s => {
    const projects = [];
    D.projects.forEach(p => {
      if(p.status === 'cancelled') return;
      const items = [];
      if(p.steps.length){
        p.steps.forEach(st => { if(!st.start || !st.end || st.who.indexOf(s.id) < 0 || st.end < mStart || st.start > mEnd) return; items.push(mkItem(p, st, st.start, st.end, mStart, mEnd, nd)); });
      } else if((p.pic === s.id || (p.team && p.team[s.id])) && !p.closed){
        const sp = spanOf(p, D.t); if(sp && !(sp[1] < mStart || sp[0] > mEnd)) items.push(mkItem(p, null, sp[0], sp[1], mStart, mEnd, nd));
      }
      if(!items.length) return;
      const segs = rowSegs(items, 'people', D, dw || 32);
      projects.push({p, items, segs, lanes: placeSegs(segs, nd), first: Math.min.apply(null, items.map(i => i.a))});
    });
    projects.sort((a, b) => a.first - b.first || (a.p.deadline || '').localeCompare(b.p.deadline || ''));
    const off = s.off || {};
    const heat = days.map(d => { const set = new Set(); projects.forEach(pr => pr.items.forEach(it => { if(d.i < it.a || d.i > it.b) return; if(it.st && it.st.state === 'done' && d.s >= D.t) return; set.add(pr.p.id); })); return set.size; });
    return {s, projects, heat, off, jobs: projects.length, busy: heat.filter(n => n > 0).length, over: heat.filter(n => n >= 3).length, offN: days.filter(d => off[d.s]).length};
  });
}
function buildProjRows(D, days, mStart, mEnd, dw){
  const nd = days.length, rows = [];
  D.projects.forEach(p => {
    if(p.status === 'cancelled') return;
    const items = [];
    p.steps.forEach(st => { if(!st.start || !st.end || st.end < mStart || st.start > mEnd) return; items.push(mkItem(p, st, st.start, st.end, mStart, mEnd, nd)); });
    if(!p.steps.length && !p.closed){ const sp = spanOf(p, D.t); if(sp && !(sp[1] < mStart || sp[0] > mEnd)) items.push(mkItem(p, null, sp[0], sp[1], mStart, mEnd, nd)); }
    const dlIn = p.deadline && p.deadline >= mStart && p.deadline <= mEnd;
    if(!items.length && !dlIn) return;
    const segs = rowSegs(items, 'projects', D, dw || 32);
    rows.push({p, items, segs, lanes: placeSegs(segs, nd)});
  });
  return rows;
}

    cls = 'sb '+st.state+(st.late ? ' late' : '');
  } else {
    title = p.name+'\nChưa lập pipeline, '+fD(p.start)+' – '+fD(p.deadline)+(p.late ? ', quá hạn' : '');
    cls = 'sb nopipe'+(p.late ? ' late' : '');

}
function ClusterSeg({sg, D}){
  const span = sg.b - sg.a + 1, out = sg.side ? sg.ext : 0, tot = span + out;
  const c0 = sg.side === 'l' ? sg.a - out : sg.a, c1 = sg.side === 'r' ? sg.b + out : sg.b;
  const cells = []; for(let d = sg.a; d <= sg.b; d++){ let best = null; sg.parts.forEach(x => { if(d >= x.a && d <= x.b && (!best || URG[x.st.state] > URG[best.st.state])) best = x; }); cells.push(best ? best.st.state : 'todo'); }
  const late = sg.parts.some(x => x.st.late), done = sg.parts.every(x => x.st.state === 'done');

function AttnBar({D, me}){

  const open = D.projects.filter(p => !p.closed);

  const soon = open.filter(p => p.daysLeft !== null && p.daysLeft >= 0 && p.daysLeft <= 7).length;
  const fixes = D.allSteps.filter(x => x.st.state === 'fix' && (!me || x.st.who.indexOf(me) >= 0)).length;
  const pendB = me === 'hao' ? D.bookings.filter(b => b.status === 'open' && b.chk.k === 'CHỜ DUYỆT').length : 0;
  const items = [];
  if(qc) items.push(['#qc', qc, isRev ? 'bước chờ bạn duyệt' : 'bước đang chờ QC', 'wait']);
  if(fixes) items.push(['#qc', fixes, me ? 'bước bạn cần sửa' : 'bước cần sửa', 'bad']);

function gateParts(g){ const i = g.label.indexOf(' · '); return i > 0 ? [g.label.slice(0, i), g.label.slice(i + 3)] : [g.id.toUpperCase(), g.label]; }
function gateState(p, g){
  if(g.na) return {cls: '', text: 'Bỏ qua, job nội bộ'};
  if(g.ok){
    const t = (g.id === 'g0' ? 'Đã ký HĐ, nhận cọc' : g.id === 'g5' ? 'Đã nghiệm thu' : 'Khách đã duyệt') + (g.at ? ' '+fD(ymd(new Date(g.at))) : '');
    if(p.pay && g.pay) return g.paid ? {cls: 'ok', text: t+', đã thu tiền'} : {cls: 'warn', text: t+', chưa thu tiền'};
    return {cls: 'ok', text: t};
  }
  if(g.violated) return {cls: g.soft ? 'warn' : 'bad', text: g.vShort || g.vText};
  return {cls: '', text: g.id === 'g0' ? 'Chờ ký HĐ, nhận cọc' : g.id === 'g5' ? 'Chờ biên bản nghiệm thu' : 'Chờ khách duyệt'};
}

        </div>
        <div class="glink">
          ${w ? html`<${InlineText} value=${g.note || ''} placeholder="Link xác nhận: email hoặc biên bản (không bắt buộc)" label="Link xác nhận" onSave=${v => set({note: v})}/>` : (g.note && !isUrl ? html`<span class="meta">${g.note}</span>` : (!g.note ? html`<span class="meta">Chưa có link xác nhận.</span>` : null))}

/* Link Drive → {id, kind}; tên file/folder lấy qua /api/drive?meta=1, nhớ trong máy để không hỏi lại */
function driveRef(u){

function fetchLinkName(u){

  if(cached) return (FN[k] = Promise.resolve(cached));
  FN[k] = fetch('/api/drive?meta=1&kind='+r.kind+'&id='+encodeURIComponent(r.id)).then(x => x.ok ? x.json() : {}).then(j => { const n = (j && j.name) || ''; if(n) lsSet('mx.fn.'+k, n); else delete FN[k]; return n; }, () => { delete FN[k]; return ''; });

  let host = ''; try { host = new URL(url).hostname.replace(/^www\./, ''); } catch(e){}
  const sub = ref ? (ref.kind === 'folder' ? 'Folder trên Google Drive' : 'File trên Google Drive') : host;
  return html`<a class=${'flink'+(big ? ' big' : '')} href=${url} target="_blank" rel="noopener" title=${url}>
    <span class="flink-ic" aria-hidden="true"><${Ic} n=${icon} s=${big ? 19 : 16}/></span>
    <span class="flink-t"><b>${nm || (ref ? (ref.kind === 'folder' ? 'Folder Google Drive' : 'File Google Drive') : shortUrl(url))}</b>${big ? html`<small>${sub}</small>` : null}</span>

function CapBar({m}){
  const segs = [['used', m.used, 'Đã dùng'], ['res', Math.max(0, m.reserved - m.used), 'Giữ chỗ chưa dùng'], ['unl', m.unlogged, 'Dùng chưa log'], ['free', Math.max(0, m.bookable), 'Còn book được']];
  const total = Math.max(m.cap, sum(segs.map(s => s[1]))) || 1;
  const shown = segs.filter(s => s[1] > 0);
  return html`<div class="capbar" role="img" aria-label=${segs.map(s => s[2]+' '+fN(s[1])).join(', ')}>
    ${shown.length ? shown.map(s => html`<i key=${s[0]} class=${'cb-'+s[0]} style=${'flex-grow:'+s[1]} title=${s[2]+': '+fN(s[1])}></i>`) : html`<i class="cb-empty"></i>`}
    ${total > m.cap && m.cap > 0 ? html`<span class="cap-tick" style=${'left:calc('+(m.cap / total * 100)+'% - 1px)'} title=${'Cap '+fN(m.cap)}></span>` : null}

}

const RV_COLORS = ['#ff4d4f', '#ffd43b', '#4dabf7', '#ffffff'];
const RV_COLOR_NAMES = ['Đỏ', 'Vàng', 'Xanh', 'Trắng'];
const RV_FPS = [24, 25, 30, 50, 60];
const VIDEO_STEPS = {s05: 1, s06: 1, s07: 1, s08: 1, s09: 1, s10: 1};
function driveId(u){
  const s = String(u || '');
  const m = s.match(/(?:drive|docs)\.google\.com\/file\/d\/([\w-]{20,})/) || s.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]{20,})/) || s.match(/drive\.usercontent\.google\.com\/download\?(?:[^#]*&)?id=([\w-]{20,})/);
  return m ? m[1] : '';
}
function reviewSrc(u){
  const id = driveId(u);
  if(id) return '/api/drive?id='+id;
  return /^https?:\/\/[^?#]+\.(mp4|webm|m4v|mov)(\?|#|$)/i.test(String(u || '')) ? String(u) : '';
}
function canReview(u){ return safeUrl(u) && !!reviewSrc(u); }
/* Link để mở player: link kết quả nếu là file video, không thì link video nộp kèm cho đúng bản đang duyệt. */
function videoLinkOf(st){
  if(canReview(st.link)) return st.link;
  return st.rv && (+st.rv.ver || 0) === st.ver && canReview(st.rv.url) ? st.rv.url : '';
}
function tcOf(t, fps){
  const f = Math.max(0, Math.floor((+t || 0) * fps + 1e-3)), s = Math.floor(f / fps);
  const hh = Math.floor(s / 3600);
  return (hh ? pad(hh)+':' : '')+pad(Math.floor(s % 3600 / 60))+':'+pad(s % 60)+':'+pad(f % fps);
}
function parseTc(v){
  const s = String(v || '').trim().replace(',', '.');
  if(!s || !/^\d+(\.\d+)?(:\d+(\.\d+)?){0,2}$/.test(s)) return null;
  return s.split(':').reduce((a, x) => a * 60 + (+x), 0);
}
const rv36 = n => { const s = Math.max(0, Math.min(1295, Math.round(n * 1295))).toString(36); return s.length < 2 ? '0'+s : s; };
function encStroke(st){ return st.c+'|'+st.p.map(q => rv36(q[0])+rv36(q[1])).join(''); }
function decStroke(s){
  const i = String(s).indexOf('|'), d = String(s).slice(i + 1), p = [];
  for(let k = 0; k + 4 <= d.length; k += 4) p.push([parseInt(d.slice(k, k + 2), 36) / 1295, parseInt(d.slice(k + 2, k + 4), 36) / 1295]);
  return {c: +String(s).slice(0, i) || 0, p};
}
function paintStrokes(cv, strokes){
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const lw = Math.max(2.5, W * 0.0045);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  strokes.forEach(st => {
    if(!st.p.length) return;
    ctx.beginPath();
    st.p.forEach((q, i) => i ? ctx.lineTo(q[0] * W, q[1] * H) : ctx.moveTo(q[0] * W, q[1] * H));
    if(st.p.length === 1) ctx.lineTo(st.p[0][0] * W + 0.5, st.p[0][1] * H);
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = lw + 3; ctx.stroke();
    ctx.strokeStyle = RV_COLORS[st.c] || RV_COLORS[0]; ctx.lineWidth = lw; ctx.stroke();
  });
}

    <p class="meta">Khách mở link là xem được video, tua, vẽ và gửi góp ý theo từng khung hình, không cần đăng nhập. Khách không thấy dữ liệu nào khác của MagentX. Góp ý của khách hiện ngay trong player này.</p>

      return html`<div key=${x.tok} class=${'rv-sl'+(live ? '' : ' dead')}>
        <div class="rv-sl-top"><${VChip} v=${x.ver} tone=${live ? ((+x.ver || 0) === st.ver ? st.state : 'old') : 'old'} sm=${true}/><span class="meta">${off ? 'Đã tắt' : exp ? 'Hết hạn '+fD(ymd(new Date(x.exp))) : 'Mở đến '+fD(ymd(new Date(x.exp)))}, tạo ${fT(x.at)}</span></div>
        <input class="inp sm code" readonly value=${url} aria-label="Link gửi khách" onFocus=${e => e.target.select()}/>
        ${x.dec && x.dec.at ? html`<span class=${'st sm '+((+x.dec.ver || 0) !== (+x.ver || 0) ? 'todo' : x.dec.ok ? 'done' : 'fix')}>Khách ${x.dec.name} ${x.dec.ok ? 'đồng ý' : 'yêu cầu sửa'} ${vTag(x.dec.ver)}</span>` : null}
        <div class="acts">
          ${live ? html`<button type="button" class="btn xs" onClick=${() => copyText(url)}><${Ic} n="copy" s=${14}/>Copy link</button>` : null}
          ${(live || exp) && (+x.ver || 0) < st.ver ? html`<button type="button" class="btn xs" onClick=${() => { put(x.tok, {ver: st.ver, url: link, on: true, exp: now + SHARE_DAYS * 864e5}); toast('Link này giờ cho khách xem '+vTag(st.ver)); }}>Đưa ${vTag(st.ver)} lên link này</button>` : null}
          ${exp && (+x.ver || 0) === st.ver ? html`<button type="button" class="btn xs" onClick=${() => { put(x.tok, {on: true, exp: now + SHARE_DAYS * 864e5}); toast('Đã gia hạn link thêm '+SHARE_DAYS+' ngày'); }}>Gia hạn ${SHARE_DAYS} ngày</button>` : null}
          ${off ? html`<button type="button" class="btn xs" onClick=${() => { put(x.tok, {on: true}); toast('Đã mở lại link'); }}>Mở lại</button>` : html`<button type="button" class="btn xs danger" onClick=${() => { put(x.tok, {on: false}); toast('Đã tắt link, khách không mở được nữa'); }}>Tắt link</button>`}
        </div>
      </div>`; })}</div>` : null}
    <div><button type="button" class="btn sm primary" onClick=${create}><${Ic} n="plus" s=${16}/>Tạo link mới cho ${vTag(st.ver)}</button></div>
    <p class="meta">Link mở trong ${SHARE_DAYS} ngày. Khi có bản mới, bấm "Đưa V… lên link này" để khách xem bản mới trên cùng link.</p>
  </div>`;
}
function ReviewPlayer({D, pid, sid, me}){
  const p = D.pmap[pid], st = p ? p.steps.find(x => x.id === sid) : null;
  const link = st ? videoLinkOf(st) : '';
  const did = driveId(link), src = reviewSrc(link);
  const vref = useRef(null), cref = useRef(null), stageRef = useRef(null), tlRef = useRef(null), taRef = useRef(null);
  const drawing = useRef(null), scrub = useRef(null), restore = useRef(null), retries = useRef(0);
  const [failed, setFailed] = useState(false);
  const [blobUrl, setBlobUrl] = useState('');
  const [load, setLoad] = useState({s: 'idle', p: 0, total: 0});
  const [waiting, setWaiting] = useState(false);
  const [shareOpen, setShareOpen] = useState(false);
  const [meta, setMeta] = useState(null);
  const [cur, setCur] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [rate, setRate] = useState(1);
  const [muted, setMuted] = useState(false);
  const [fps, setFps] = useState(() => { const f = +lsGet('mx.fps'); return RV_FPS.indexOf(f) >= 0 ? f : 25; });
  const [box, setBox] = useState(null);
  const [tool, setTool] = useState(false);
  const [color, setColor] = useState(0);
  const [draft, setDraft] = useState([]);
  const [draftT, setDraftT] = useState(null);
  const [text, setText] = useState('');
  const [manual, setManual] = useState('');
  const [sel, setSel] = useState('');
  const all = st ? st.vnotes : [];
  const older = all.filter(n => (+n.ver || 0) !== (st ? st.ver : 0));
  const [old, setOld] = useState(() => older.length > 0 && older.length === all.length);
  const mode = !src ? 'none' : failed ? (did ? 'frame' : 'none') : 'video';
  const w = canW();
  const frame = 1 / fps;
  const tc = t => tcOf(t, fps);

  useEffect(() => { const o = document.body.style.overflow; document.body.style.overflow = 'hidden'; return () => { document.body.style.overflow = o; }; }, []);
  /* tải sẵn cả file về máy: tua tức thì, không phụ thuộc mạng */
  useEffect(() => {
    if(!did || failed || !window.RV) return;
    const job = RV.preload(did, {key: 'v'+(st ? st.ver : 0), onProgress: (l, t) => setLoad({s: 'loading', p: l, total: t})});
    let url = '';
    job.promise.then(b => {
      url = URL.createObjectURL(b);
      const v = vref.current; restore.current = v ? {t: v.currentTime, play: !v.paused} : null;
      setBlobUrl(url); setLoad(x => ({s: 'done', p: x.total || b.size, total: x.total || b.size}));
    }, e => setLoad(x => ({s: e && e.code === 'too_big' ? 'big' : 'stream', p: x.p, total: (e && e.total) || x.total})));
    return () => { job.cancel(); if(url) URL.revokeObjectURL(url); };
  }, [did, failed]);
  /* không đọc được video trong 25 giây thì chuyển sang trình xem của Drive */
  useEffect(() => { if(mode !== 'video' || meta) return; const t = setTimeout(() => setFailed(true), 25000); return () => clearTimeout(t); }, [mode, !!meta, src]);
  useEffect(() => {
    const el = stageRef.current; if(!el) return;
    const fit = () => { const W = el.clientWidth, H = el.clientHeight; const ar = meta && meta.w && meta.h ? meta.w / meta.h : 16 / 9; let bw = W, bh = W / ar; if(bh > H){ bh = H; bw = H * ar; } setBox(b => b && b.w === Math.floor(bw) && b.h === Math.floor(bh) ? b : {w: Math.floor(bw), h: Math.floor(bh)}); };
    fit();
    if(!window.ResizeObserver){ window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit); }
    const ro = new ResizeObserver(fit); ro.observe(el); return () => ro.disconnect();
  }, [meta && meta.w, meta && meta.h, mode]);
  useEffect(() => {
    if(!playing) return; let id;
    const tick = () => { const v = vref.current; if(v) setCur(v.currentTime); id = requestAnimationFrame(tick); };
    id = requestAnimationFrame(tick); return () => cancelAnimationFrame(id);
  }, [playing]);

  const notes = all.filter(n => old || (+n.ver || 0) === (st ? st.ver : 0));
  const openN = notes.filter(n => !n.ok).length;
  const selNote = sel ? notes.find(n => n.nid === sel) : null;
  const passing = !selNote && mode === 'video' ? (playing ? notes.slice().reverse().find(n => n.t <= cur && cur < n.t + 1.2 && n.d && n.d.length) : notes.find(n => Math.abs(n.t - cur) <= frame * 0.6)) : null;
  const act = selNote || passing || null;
  const draftHere = draft.length > 0 && (mode !== 'video' || draftT === null || Math.abs(cur - draftT) <= frame * 0.6);
  const shown = draftHere ? draft : (!draft.length && act && act.d ? act.d.map(decStroke) : []);
  const repaint = () => {
    const cv = cref.current; if(!cv || !box) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1), W = Math.round(box.w * dpr), H = Math.round(box.h * dpr);
    if(cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
    paintStrokes(cv, shown);
  };
  useEffect(repaint);

  const seek = (t, keep) => { const v = vref.current, d = meta ? meta.dur : 0; const x = Math.max(0, Math.min(d || 0, t)); if(v) v.currentTime = x; setCur(x); if(!keep) setSel(''); };
  const toggle = () => { const v = vref.current; if(!v) return; if(v.paused){ setSel(''); v.play().catch(() => {}); } else v.pause(); };
  const stepF = k => { const v = vref.current; if(!v || !meta) return; v.pause(); seek((Math.round(v.currentTime * fps) + k) / fps + 0.001); };
  const jump = n => { const v = vref.current; if(v && mode === 'video'){ v.pause(); seek(n.t + 0.0005, true); } setSel(n.nid); };
  const anchor = draft.length && draftT !== null ? draftT : cur;

  const patchNote = (nid, o) => W.project(p.id, {steps: {[st.id]: {vn: {[nid]: o}}}});
  const addNote = () => {
    const body = text.trim(); if(!body && !draft.length) return;
    let t = anchor;
    if(mode !== 'video'){ t = parseTc(manual); if(t === null){ toast('Nhập thời điểm dạng phút:giây, ví dụ 0:12.', 'warn'); return; } }
    const d = draft.filter(s => s.p.length).map(encStroke);
    if(d.join('').length > 14000){ toast('Nét vẽ quá nhiều. Bấm Hoàn tác bớt vài nét rồi lưu lại.', 'warn'); return; }
    const nid = rid('n');
    patchNote(nid, {t: +t.toFixed(3), text: body, by: me || null, at: Date.now(), ver: st.ver, d});
    setText(''); setManual(''); setDraft([]); setDraftT(null); setTool(false); setSel(nid);
    toast('Đã thêm ghi chú tại '+tc(t));
  };
  const approve = ok => { const now = Date.now(); const o = {qc: {[me]: {ok, ver: st.ver, at: now, uid: S.uid || null}}}; if(ok && st.fix && st.fix.by === me) o.fix = null; W.project(p.id, {steps: {[st.id]: o}}); toast(ok ? 'Đã duyệt '+vTag(st.ver) : 'Đã bỏ duyệt'); };
  const askFix = () => {
    const now = Date.now(), n = all.filter(x => !x.ok && (+x.ver || 0) === st.ver).length;
    W.project(p.id, {steps: {[st.id]: {cm: {[rid('c')]: {by: me, at: now, text: n ? 'Cần sửa theo '+n+' ghi chú trên video.' : 'Cần sửa, xem ghi chú trên video.', kind: 'fix', ver: st.ver}}, fix: {by: me, at: now, ver: st.ver}, qc: {[me]: {ok: false, ver: st.ver, at: now, uid: S.uid || null}}}}});
    toast('Đã gửi yêu cầu sửa');
  };

  /* vẽ */
  const pt = e => { const r = cref.current.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
  const dDown = e => {
    if(!tool || draft.length >= 24) return; e.preventDefault();
    try { cref.current.setPointerCapture(e.pointerId); } catch(x){}
    const v = vref.current; if(v && !v.paused) v.pause();
    if(!draft.length) setDraftT(v && mode === 'video' ? v.currentTime : null);
    drawing.current = {c: color, p: [pt(e)]}; setSel('');
    setDraft(d => d.concat([drawing.current]));
  };
  const dMove = e => { const s = drawing.current; if(!s) return; const q = pt(e), l = s.p[s.p.length - 1]; if(s.p.length >= 400 || Math.hypot(q[0] - l[0], q[1] - l[1]) < 0.004) return; s.p.push(q); repaint(); };
  const dUp = () => { if(drawing.current){ drawing.current = null; setDraft(d => d.slice()); } };
  const toolOn = on => { const v = vref.current; if(on && v && !v.paused) v.pause(); setTool(on); };

  /* tua bằng thanh thời gian */
  const tlAt = e => { const r = tlRef.current.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * (meta ? meta.dur : 0); };
  const tDown = e => { const v = vref.current; if(!v || !meta) return; e.preventDefault(); try { tlRef.current.setPointerCapture(e.pointerId); } catch(x){} scrub.current = {was: !v.paused}; v.pause(); seek(tlAt(e)); };
  const tMove = e => { if(scrub.current) seek(tlAt(e)); };
  const tUp = () => { const s = scrub.current; scrub.current = null; if(s && s.was && vref.current) vref.current.play().catch(() => {}); };

  const keyRef = useRef(null);
  keyRef.current = e => {
    const tag = (e.target && e.target.tagName) || '', typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if(e.key === 'Escape'){ e.stopPropagation(); if(typing) e.target.blur(); else if(tool) setTool(false); else closeModal(); return; }
    if(typing || e.ctrlKey || e.metaKey || e.altKey || mode !== 'video') return;
    if(e.key === ' ' || e.key === 'k' || e.key === 'K'){ e.preventDefault(); toggle(); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); e.shiftKey ? seek(cur - 1) : stepF(-1); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); e.shiftKey ? seek(cur + 1) : stepF(1); }
    else if(e.key === 'd' || e.key === 'D'){ if(w){ e.preventDefault(); toolOn(!tool); } }
    else if(e.key === 'n' || e.key === 'N'){ if(w && taRef.current){ e.preventDefault(); taRef.current.focus(); } }
  };
  useEffect(() => { const h = e => keyRef.current(e); document.addEventListener('keydown', h, true); return () => document.removeEventListener('keydown', h, true); }, []);

  if(!p || !st) return html`<div class="rv"><div class="rv-h"><b>Không tìm thấy bước này.</b><span class="sp"></span><button type="button" class="btn sm" onClick=${closeModal}>Đóng</button></div></div>`;
  const myReview = !!(me && w && st.qcBy.indexOf(me) >= 0);
  const iApproved = myReview && st.approvedBy.indexOf(me) >= 0;
  const dur = meta ? meta.dur : 0;
  const pct = t => (dur ? Math.max(0, Math.min(100, t / dur * 100)) : 0)+'%';
  const canDel = n => w && (n.src === 'client' ? me === 'hao' : (n.by === me || me === 'hao'));
  return html`<div class="rv" role="dialog" aria-modal="true" aria-label=${'Duyệt video: '+st.def.name}>
    <header class="rv-h">
      <div class="rv-title"><b>${st.def.no} ${st.def.name} <${VChip} v=${st.ver} tone=${st.state}/></b><span class="meta">${p.name}${st.lname ? ', '+st.lname : ''}</span></div>
      <span class="sp"></span>
      ${w && link ? html`<div class="rv-share-wrap"><button type="button" class=${'btn sm rv-share-btn'+(shareOpen ? ' on' : '')} aria-expanded=${shareOpen} onClick=${() => setShareOpen(!shareOpen)}><${Ic} n="send" s=${16}/>Gửi khách${st.shares.length ? ' ('+st.shares.filter(x => x.on !== false && !(x.exp && x.exp < Date.now())).length+')' : ''}</button>${shareOpen ? html`<${SharePanel} p=${p} st=${st} link=${link} me=${me} onClose=${() => setShareOpen(false)}/>` : null}</div>` : null}
      <a class="btn sm" href=${link} target="_blank" rel="noopener"><${Ic} n="ext" s=${16}/>Mở trên Drive</a>
      <button type="button" class="btn sm" onClick=${closeModal}><${Ic} n="x" s=${16}/>Đóng</button>
    </header>
    <div class="rv-main">
      <div class="rv-left">
        <div class="rv-stage" ref=${stageRef}>
          ${mode === 'none' ? html`<p class="rv-msg">Không phát được link này. Player cần link tới file video trên Google Drive.</p>` : html`<div class="rv-fit" style=${box ? 'width:'+box.w+'px;height:'+box.h+'px' : 'width:100%;height:100%'}>
            ${mode === 'video'
              ? html`<video ref=${vref} src=${blobUrl || src} playsinline preload="auto" muted=${muted}
                  onLoadedMetadata=${e => { const v = e.target; setMeta({dur: v.duration || 0, w: v.videoWidth, h: v.videoHeight}); const r = restore.current; restore.current = null; if(r){ v.currentTime = r.t; v.playbackRate = rate; if(r.play) v.play().catch(() => {}); } }}
                  onWaiting=${() => setWaiting(true)} onPlaying=${() => { setWaiting(false); retries.current = 0; }} onCanPlay=${() => setWaiting(false)}
                  onPlay=${() => setPlaying(true)} onPause=${e => { setPlaying(false); setCur(e.target.currentTime); }} onEnded=${() => setPlaying(false)}
                  onTimeUpdate=${e => { if(!playing) setCur(e.target.currentTime); }} onSeeked=${e => { setCur(e.target.currentTime); setWaiting(false); }}
                  onError=${() => { const v = vref.current; if(!meta){ if(!blobUrl) setFailed(true); return; } if(retries.current < 4 && v){ retries.current++; restore.current = {t: v.currentTime || cur, play: !v.paused}; const s0 = v.src; v.removeAttribute('src'); v.load(); setTimeout(() => { v.src = s0; v.load(); }, 600 * retries.current); } else toast('Mạng đang chập chờn. Tải lại trang nếu video không chạy tiếp.', 'warn'); }}
                  onClick=${() => { if(!tool) toggle(); }}></video>`
              : html`<iframe src=${'https://drive.google.com/file/d/'+did+'/preview'} allow="autoplay; fullscreen" title="Video trên Google Drive"></iframe>`}
            <canvas ref=${cref} class=${tool ? 'on' : ''} onPointerDown=${dDown} onPointerMove=${dMove} onPointerUp=${dUp} onPointerCancel=${dUp}></canvas>
            ${mode === 'video' && !meta ? html`<p class="rv-msg over">Đang tải video từ Google Drive…</p>` : mode === 'video' && waiting ? html`<p class="rv-msg over">Đang tải…</p>` : null}
          </div>`}
        </div>
        <div class="rv-ctl">
          ${mode === 'video' ? html`
            <div class="rv-tl" ref=${tlRef} role="slider" tabindex="0" aria-label="Thanh thời gian" aria-valuemin="0" aria-valuemax=${Math.round(dur)} aria-valuenow=${Math.round(cur)} aria-valuetext=${tc(cur)} onPointerDown=${tDown} onPointerMove=${tMove} onPointerUp=${tUp} onPointerCancel=${tUp}>
              ${load.s === 'done' ? html`<i class="buf" style="width:100%"></i>` : null}<i class="fill" style=${'width:'+pct(cur)}></i>
              ${notes.map(n => html`<b key=${n.nid} class=${(n.ok ? 'ok' : '')+(n.src === 'client' ? ' cl' : '')+((+n.ver || 0) !== st.ver ? ' old' : '')+(act && act.nid === n.nid ? ' sel' : '')} style=${'left:'+pct(n.t)}></b>`)}
              <i class="head" style=${'left:'+pct(cur)}></i>
            </div>
            <div class="rv-bar">
              <button type="button" class="btn sm primary rv-play" disabled=${!meta} onClick=${toggle} aria-label=${playing ? 'Dừng' : 'Phát'}><${Ic} n=${playing ? 'pause' : 'play'} s=${17}/>${playing ? 'Dừng' : 'Phát'}</button>
              <button type="button" class="icon-btn sm" disabled=${!meta} onClick=${() => stepF(-1)} title="Lùi 1 khung hình (phím ←)" aria-label="Lùi 1 khung hình"><${Ic} n="left" s=${16}/></button>
              <button type="button" class="icon-btn sm" disabled=${!meta} onClick=${() => stepF(1)} title="Tới 1 khung hình (phím →)" aria-label="Tới 1 khung hình"><${Ic} n="right" s=${16}/></button>
              <span class="rv-tc" aria-live="off"><b>${tc(cur)}</b> / ${tc(dur)}</span>
              <span class="sp"></span>
              <select class="sel sm auto" value=${rate} aria-label="Tốc độ phát" onChange=${e => { const r = +e.target.value; setRate(r); if(vref.current) vref.current.playbackRate = r; }}>${[0.25, 0.5, 1, 1.5, 2].map(r => html`<option key=${r} value=${r}>${r}×</option>`)}</select>
              <select class="sel sm auto" value=${fps} aria-label="Số khung hình mỗi giây" title="Số khung hình mỗi giây của video" onChange=${e => { const f = +e.target.value; setFps(f); lsSet('mx.fps', String(f)); }}>${RV_FPS.map(f => html`<option key=${f} value=${f}>${f} fps</option>`)}</select>
              <button type="button" class="icon-btn sm" onClick=${() => setMuted(!muted)} title=${muted ? 'Bật tiếng' : 'Tắt tiếng'} aria-label=${muted ? 'Bật tiếng' : 'Tắt tiếng'}><${Ic} n=${muted ? 'mute' : 'vol'} s=${16}/></button>
            </div>

            : mode === 'frame' ? html`<p class="rv-note">Không phát trực tiếp được file này nên đang dùng trình xem của Google Drive: không tua theo khung hình được, thời điểm ghi chú phải nhập tay. Để dùng đủ tính năng, file cần là MP4 (H.264) và chia sẻ “Bất kỳ ai có đường liên kết”. <button type="button" class="btn xs" onClick=${() => { setMeta(null); setFailed(false); }}>Thử phát lại</button></p>` : null}
          ${w && mode !== 'none' ? html`
            <div class="rv-bar">
              <button type="button" class=${'btn sm'+(tool ? ' on' : '')} aria-pressed=${tool} onClick=${() => toolOn(!tool)} title="Vẽ lên khung hình (phím D)"><${Ic} n="edit" s=${16}/>${tool ? 'Đang vẽ' : 'Vẽ lên khung hình'}</button>
              ${tool || draft.length ? html`<div class="rv-colors" role="radiogroup" aria-label="Màu nét vẽ">${RV_COLORS.map((c, i) => html`<button key=${c} type="button" role="radio" aria-checked=${color === i} aria-label=${RV_COLOR_NAMES[i]} title=${RV_COLOR_NAMES[i]} class=${color === i ? 'on' : ''} style=${'--c:'+c} onClick=${() => setColor(i)}></button>`)}</div>

      <${FormSec} n="2" title="Quy trình và thời gian" desc="Chọn quy trình, rồi chọn ngày bắt đầu và deadline." done=${okTime}>
        <div class="field"><span class="lab">Quy trình</span><div class="opts c4">${['A','B','C',''].map(k => html`<label key=${k || 'none'} class=${'opt'+(f.tier === k ? ' on' : '')}><input type="radio" name="pf-tier" checked=${f.tier === k} onChange=${() => set('tier', k)}/><span><b>${k ? TIERS[k].label : 'Job nhanh'}</b><small>${k ? TIERS[k].steps.length+' bước' : 'không pipeline'}</small></span></label>`)}</div><span class="tier-hint">${TIER_HINT[f.tier || '']}</span>${editing && f.tier !== p0.tier ? html`<span class="hint warn-t">Đổi quy trình sẽ bật hoặc tắt các bước theo mẫu mới.</span>` : null}</div>
        <div class="field"><span class="lab">Thời gian dự án</span><${DateRange} start=${f.start} end=${f.deadline} labels=${['Ngày bắt đầu', 'Deadline cuối']} onChange=${(x1, x2) => setF(x => Object.assign({}, x, {start: x1, deadline: x2}))}/>${badDates ? html`<span class="hint bad-t">Deadline đang trước ngày bắt đầu.</span>` : null}</div>
      <//>
      <${FormSec} n="3" title="Ai làm" desc="Chọn một hoặc nhiều người. Số job là việc họ đang có trong thời gian trên." done=${okTeam}>
        <div class="opts cn" style=${'--cols:'+cols(loads.length)}>${loads.map(l => { const on = !!tm.team[l.s.id]; return html`<label key=${l.s.id} class=${'opt'+(on ? ' on' : '')}><input type="checkbox" checked=${on} onChange=${() => togglePerson(l.s.id)}/><span><b>${l.s.name}${on && members.length > 1 && tm.pic === l.s.id ? ' (chủ trì)' : ''}</b><small class=${l.jobs >= 3 ? 'bad-t' : ''}>${l.jobs} job${l.off ? ', nghỉ '+l.off+' ngày' : ''}${l.jobs >= 3 ? ', đang kín' : ''}</small></span></label>`; })}</div>
        ${members.length === 1 ? html`<span class="hint">${nameOf(D, members[0])} nhận tất cả các bước. Chọn thêm người nếu làm chung.</span>` : null}
        ${roleBlock}
        ${reassignBox}
      <//>
      <${FormSec} n="4" title=${editing ? 'Mã job' : 'Mã job và credit'} desc=${html`Mã job tự tạo theo chuẩn <span class="nw">MX-YYMM-KHÁCH-NN</span>.`} done=${!!code && !dup}>
        <div class="field"><span class="lab">Mã job</span>
          <div class="acts">${code ? html`<span class=${'code'+(dup ? ' bad-t' : '')} style="font-size:17px">${code}</span>` : html`<span class="meta">${ext ? 'Điền khách hàng để tạo mã' : 'Chọn loại dự án để tạo mã'}</span>`}${!codeEdit ? html`<button type="button" class="btn xs" onClick=${() => setCodeEdit(true)}><${Ic} n="edit" s=${14}/>Sửa mã</button>` : null}</div>
          ${codeEdit ? html`<div class="grid3"><div class="field"><span class="hint">Năm tháng</span><input class="inp code" value=${yymm} maxlength="4" aria-label="YYMM" onInput=${e => set('yymm', e.target.value.replace(/\D/g, '').slice(0,4))}/></div><div class="field"><span class="hint">Mã khách</span><input class="inp code" value=${cc} placeholder="KHACH" aria-label="Mã khách" onInput=${e => set('clientCode', codeify(e.target.value))}/></div><div class="field"><span class="hint">Số thứ tự</span><input class="inp code" value=${pad(seq)} aria-label="Số thứ tự" onInput=${e => set('seq', toInt(e.target.value) || 0)}/></div></div>` : null}
          ${dup ? html`<span class="hint bad-t">Trùng mã với dự án khác, đổi số thứ tự.</span>` : null}
        </div>
        ${!editing ? html`<div class="field"><label class="lab" for="pf-est">Credit Higgsfield dự kiến${optTag}</label><input id="pf-est" class="inp" inputmode="numeric" value=${f.est} placeholder="Tổng cho cả dự án" onInput=${e => set('est', e.target.value.replace(/[^\d]/g, ''))}/>
          ${!need ? html`<span class="hint">Để trống nếu chưa gen. Có thể book credit sau trong trang dự án.</span>` : null}
          ${need ? (accEdit ? html`<select class="sel" value=${accId} aria-label="Account Higgsfield" onChange=${e => set('acc', e.target.value)}><option value="">Chưa chọn</option>${sg.rows.map(rw => html`<option key=${rw.a.id} value=${rw.a.id} disabled=${!rw.okScope}>${rw.a.code}, còn ${fN(rw.room)}${!rw.okScope ? ', chỉ job khách' : ''}${rw.okScope && !rw.fits ? ', không đủ' : ''}</option>`)}</select>`
            : accRow ? html`<div class="acts"><span class="hint">Sẽ book vào <b>${accRow.a.code}</b> (còn ${fN(accRow.room)} credit)${accRow.fits ? '' : html`, <span class="bad-t">không đủ chỗ</span>`}.</span><button type="button" class="btn xs" onClick=${() => setAccEdit(true)}>Đổi account</button></div>`
            : html`<div class="acts"><span class="hint bad-t">Không account nào đủ chỗ. Đề xuất mua top-up hoặc dời sang kỳ reset sau.</span><button type="button" class="btn xs" onClick=${() => setAccEdit(true)}>Chọn account</button></div>`) : null}</div>` : null}
      <//>
      <${FormSec} n="5" title="Chi tiết hợp đồng" optional=${true} desc="Workflow, thời lượng, giá trị HĐ, số vòng sửa, ghi chú." open=${more} onToggle=${() => setMore(!more)}>
        <div class="grid2 al-top">
          <div class="field"><span class="lab">Workflow</span><div class="opts c2">${['Full AI','Hybrid'].map(o => html`<label key=${o} class=${'opt'+(f.workflow === o ? ' on' : '')}><input type="radio" name="pf-wf" checked=${f.workflow === o} onChange=${() => set('workflow', o)}/><span><b>${o}</b></span></label>`)}</div></div>
          <div class="field"><label class="lab" for="pf-dur">Thời lượng</label><input id="pf-dur" class="inp" value=${f.duration} placeholder="VD: 30s, 15s × 5" onInput=${e => set('duration', e.target.value)}/></div>
        </div>
        <div class="grid2 al-top">
          ${ext ? html`<div class="field"><label class="lab" for="pf-val">Giá trị HĐ (triệu VND)</label><input id="pf-val" class="inp" inputmode="numeric" value=${f.value} onInput=${e => set('value', e.target.value.replace(/[^\d]/g, ''))}/></div>` : null}
          <div class="field"><label class="lab" for="pf-rev">Số vòng sửa theo HĐ</label><input id="pf-rev" class="inp" inputmode="numeric" value=${f.revAllowed} onInput=${e => set('revAllowed', e.target.value.replace(/[^\d]/g, ''))}/></div>
        </div>
        <div class="field"><label class="lab" for="pf-note">Ghi chú</label><textarea id="pf-note" class="inp" rows="2" value=${f.note} onInput=${e => set('note', e.target.value)}></textarea></div>
      <//>
      </div>
      <div class="modal-f">
        ${editing && (S.isOwner || isLead(D, meId())) ? (confirmDel ? html`<button type="button" class="btn danger" onClick=${del}>Bấm lần nữa để xóa hẳn</button>` : html`<button type="button" class="btn danger" onClick=${() => setConfirmDel(true)}>Xóa dự án</button>`) : null}
        ${!editing ? html`<span class=${'foot-msg '+(missing.length ? 'warn-t' : 'good-t')} role="status">${missing.length ? 'Còn thiếu: '+missing.join(', ') : 'Đã đủ thông tin bắt buộc'}</span>` : null}
        <span class="sp"></span>
        <button type="button" class="btn lg" onClick=${closeModal}>Hủy</button>
        <button type="submit" class="btn primary lg" disabled=${!canSave}><${Ic} n="check"/>${editing ? 'Lưu thay đổi' : 'Tạo dự án'}</button>
      </div>
    </form>
  <//>`;
}

/* ---------- app ---------- */
function NoDb(){
  return html`<div class="empty"><b>Chưa kết nối được database.</b><span>${window.__mxDbError === 'config' ? 'Chưa dán cấu hình Firebase (FIREBASE_CONFIG) vào file index.html.' : 'Kiểm tra kết nối mạng rồi tải lại trang. Nếu vẫn lỗi, báo người quản lý bảng.'}</span><a class="btn" href="#dat-ten">Mở trang Đặt tên file</a></div>`;
}
function ModalHost({D, me}){
  const m = S.modal; if(!m) return null;
  if(m.type === 'project') return html`<${ProjectForm} key=${m.pid || 'new'} D=${D} pid=${m.pid}/>`;
  if(m.type === 'identity') return html`<${IdentityModal} D=${D} me=${me}/>`;
  if(m.type === 'account') return html`<${AccountForm} key=${m.aid || 'new'} D=${D} aid=${m.aid}/>`;
  if(m.type === 'review') return html`<${ReviewPlayer} key=${m.pid+'/'+m.sid} D=${D} pid=${m.pid} sid=${m.sid} me=${me}/>`;
  return null;
}
function App(){
  useStore();
  const route = useRoute();
  const D = useMemo(derive, [S.v]);
  const me = meId();
  useEffect(() => {
    if(S.localMe){
      const ss = sessGet();
      if(!ss || ss.staff !== S.localMe) logout('Phiên đăng nhập đã hết hạn. Nhập lại mã PIN để tiếp tục.');
      else if(S.got.staff){ const st = S.staff[S.localMe]; if(!st || !hasPin(S.localMe) || (st.pin.at || 0) !== ss.pv) logout('Mã PIN của tài khoản này vừa được đổi hoặc đặt lại. Đăng nhập lại.'); }
    }
    if(S.phase === 'ready' && S.got.staff && !meId() && !S.idAsked && D.staffList.length && !S.modal){ S.idAsked = true; openModal({type: 'identity'}); }
  });
  useEffect(() => { const t = setInterval(() => { if(S.localMe && !sessGet()) logout('Phiên đăng nhập đã hết hạn. Nhập lại mã PIN để tiếp tục.'); }, 60000); return () => clearInterval(t); }, []);
  useEffect(() => { if(route.view !== 'job') window.scrollTo(0, 0); }, [route.view]);
  const free = route.view === 'dat-ten';
  let view;
  if(!free && S.phase === 'nodb') view = html`<${NoDb}/>`;
  else if(!free && S.phase === 'ready' && !me) view = html`<div class="boot"><div class="boot-card"><b>Đăng nhập để xem bảng</b><span>Chọn tên của bạn và nhập mã PIN 4 số.</span><button type="button" class="btn primary" onClick=${() => openModal({type:'identity'})}><${Ic} n="user" s=${16}/>Đăng nhập</button></div></div>`;
  else if(!free && (S.phase === 'boot' || !S.firstData)) view = html`<div class="boot"><div class="boot-card"><b>Đang tải dữ liệu phòng…</b><span>Lịch, dự án và credit Higgsfield.</span></div></div>`;
  else if(route.view === 'du-an') view = html`<${ProjectsView} D=${D}/>`;
  else if(route.view === 'qc') view = html`<${QCView} D=${D} me=${me}/>`;
  else if(route.view === 'credit') view = html`<${CreditView} D=${D} me=${me}/>`;
  else if(route.view === 'dat-ten') view = html`<${NamingView} D=${D}/>`;
  else if(route.view === 'cai-dat') view = html`<${SettingsView} D=${D} me=${me}/>`;
  else if(route.view === 'job') view = html`<${ProjectDetail} key=${route.id} D=${D} id=${route.id} me=${me}/>`;
  else view = html`<${CalendarView} D=${D} me=${me}/>`;
  return html`
    <${TopBar} D=${D} route=${route} me=${me}/>
    <main class="wrap">
      ${S.stale ? html`<div class="banner warn">Chưa tải được dữ liệu mới nhất, có thể đang mất kết nối. Những gì đang hiện có thể chưa cập nhật.</div>` : null}
      ${false ? html`<div class="banner login-banner"><span>Bạn đang xem, chưa đăng nhập. Đăng nhập để tạo dự án, nộp link, duyệt QC.</span><button type="button" class="btn sm primary" onClick=${() => openModal({type:'identity'})}><${Ic} n="user" s=${16}/>Đăng nhập</button></div>` : null}
      ${S.readOnly && S.phase === 'ready' ? html`<div class="banner">Bạn đang ở chế độ chỉ xem. Database đang chặn quyền ghi, báo người quản lý bảng kiểm tra Firestore Rules.</div>` : null}
      ${view}
    </main>
    <${ModalHost} D=${D} me=${me}/>
    <${Toasts}/>`;
}

const root = document.getElementById('app');
root.textContent = '';
render(html`<${App}/>`, root);
boot();
})();
</script>
