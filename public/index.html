<title>MagentX Production Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: top bar (tabs + one blue "Tạo dự án") over a 1320px column; each page = large title row, then sections.
   Hierarchy: action = button with icon (blue fill for the main one, outlined for the rest, green for approve);
   input = white field, 1.5px border, bold label above; information = plain text in two sizes. Nothing else gets a box.
   One loud element: the "today" column runs as a blue band through the whole month board. */
:root{
  --paper:#f2f4f8; --surface:#ffffff; --subtle:#f7f8fb; --tint:#eceff6;
  --ink:#171b2e; --ink-2:#4b5369; --ink-3:#7c8396;
  --rule:#e0e4ed; --field:#b3bbcc; --field-hover:#8a93a8;
  --action:#2347d6; --action-hover:#1a39b6; --action-soft:#e4eaff; --on-action:#ffffff;
  --ok:#1b8448; --ok-soft:#e1f3e8; --wait:#9a5900; --wait-soft:#fff1d6; --bad:#c3342b; --bad-soft:#fde8e6; --on-wait:#2a1d00;
  --d-todo:#a9b1c1; --d-doing:#3c73e0; --d-review:#e0a000; --d-fix:#d6423a; --d-done:#2e9c59;
  --c-todo:#e3e7ee; --c-doing:#cddafb; --c-review:#fbe4ab; --c-fix:#f9cdc8; --c-done:#cfeedb; --c-nopipe:#e8ebf1;
  --heat1:#e8eefc; --heat2:#c6d6f8; --heat3:#f8cfca;
  --shadow:0 14px 44px rgb(23 27 46 / .2);
  --scrim:rgb(15 18 30 / .46);
  --f:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --namew:240px; --dayw:32px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1219; --surface:#171b25; --subtle:#1b2030; --tint:#232a3b;
    --ink:#eceff6; --ink-2:#aeb5c7; --ink-3:#808899;
    --rule:#2a3142; --field:#4c5672; --field-hover:#6a7594;
    --action:#7c9dff; --action-hover:#98b2ff; --action-soft:#1f2b4d; --on-action:#0f1219;
    --ok:#5ccf8a; --ok-soft:#173523; --wait:#f0bd5a; --wait-soft:#3a2d10; --bad:#ff7d73; --bad-soft:#40201e; --on-wait:#2a1d00;
    --d-todo:#626e84; --d-doing:#6f9bff; --d-review:#e5ad2e; --d-fix:#ff6b62; --d-done:#4cc27d;
    --c-todo:#262e3d; --c-doing:#213a6e; --c-review:#4d3c13; --c-fix:#522523; --c-done:#193f2a; --c-nopipe:#232b39;
    --heat1:#1b2643; --heat2:#27427f; --heat3:#5d2824;
    --shadow:0 14px 44px rgb(0 0 0 / .55);
    --scrim:rgb(0 0 0 / .62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1219; --surface:#171b25; --subtle:#1b2030; --tint:#232a3b;
  --ink:#eceff6; --ink-2:#aeb5c7; --ink-3:#808899;
  --rule:#2a3142; --field:#4c5672; --field-hover:#6a7594;
  --action:#7c9dff; --action-hover:#98b2ff; --action-soft:#1f2b4d; --on-action:#0f1219;
  --ok:#5ccf8a; --ok-soft:#173523; --wait:#f0bd5a; --wait-soft:#3a2d10; --bad:#ff7d73; --bad-soft:#40201e; --on-wait:#2a1d00;
  --d-todo:#626e84; --d-doing:#6f9bff; --d-review:#e5ad2e; --d-fix:#ff6b62; --d-done:#4cc27d;
  --c-todo:#262e3d; --c-doing:#213a6e; --c-review:#4d3c13; --c-fix:#522523; --c-done:#193f2a; --c-nopipe:#232b39;
  --heat1:#1b2643; --heat2:#27427f; --heat3:#5d2824;
  --shadow:0 14px 44px rgb(0 0 0 / .55);
  --scrim:rgb(0 0 0 / .62);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--f);-webkit-font-smoothing:antialiased}
a{color:var(--action);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--action);outline-offset:2px}
h1{margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
h3{margin:0;font-size:17px;line-height:1.35;font-weight:700}
h4{margin:0;font-size:15px;line-height:1.4;font-weight:700}
p{margin:0}
.meta{font-size:13.5px;color:var(--ink-2)}
.faint{color:var(--ink-3)}
.code{font-family:var(--f-code);font-weight:600;letter-spacing:-.01em}
.bad-t{color:var(--bad)}
.warn-t{color:var(--wait)}
.good-t{color:var(--ok)}
.nw{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.top-in{max-width:1320px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:24px;height:66px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand .sub{font-weight:500;color:var(--ink-2)}
.nav{display:flex;align-self:stretch;gap:2px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{position:relative;display:flex;align-items:center;gap:8px;padding:0 13px;font-size:15px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.nav a:hover{color:var(--ink);text-decoration:none;background:var(--subtle)}
.nav a.on{color:var(--ink);font-weight:700}
.nav a.on::after{content:"";position:absolute;left:13px;right:13px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--action)}
.cnt{display:inline-block;min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--d-review);color:var(--on-wait);font-size:12px;font-weight:800;line-height:21px;text-align:center}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
@media (max-width:1000px){
  .top-in{flex-wrap:wrap;height:auto;gap:0 10px;padding-block:8px 0}
  .brand{flex:1 1 auto;min-height:46px}
  .nav{order:3;flex-basis:100%;height:48px;margin-inline:-8px}
}
@media (max-width:560px){.brand .sub{display:none}.top-r .who-name{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1.5px solid var(--field);background:var(--surface);color:var(--ink);font:600 15px/1 var(--f);cursor:pointer;white-space:nowrap;text-decoration:none;transition:background-color .12s,border-color .12s}
.btn svg{flex:none}
.btn:hover{background:var(--tint);border-color:var(--field-hover);text-decoration:none}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:disabled:hover{background:var(--surface);border-color:var(--field)}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--on-action)}
.btn.primary:hover{background:var(--action-hover);border-color:var(--action-hover)}
.btn.primary:disabled:hover{background:var(--action);border-color:var(--action)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-action)}
.btn.ok:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in oklab,var(--bad) 55%,var(--field))}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{height:36px;padding:0 13px;font-size:14px;gap:7px;border-radius:9px}
.btn.xs{height:30px;padding:0 10px;font-size:13.5px;gap:6px;border-radius:8px;border-width:1px}
.btn.lg{height:46px;padding:0 22px;font-size:16px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border-radius:10px;border:1.5px solid var(--field);background:var(--surface);color:var(--ink);cursor:pointer}
.icon-btn:hover{background:var(--tint);border-color:var(--field-hover);text-decoration:none}
.icon-btn.sm{width:30px;height:30px;border-radius:8px;border-width:1px}
.icon-btn.bare{border-color:transparent;background:transparent;color:var(--ink-2)}
.icon-btn.bare:hover{background:var(--tint);color:var(--ink)}
.icon-btn.on{color:var(--action);background:var(--action-soft);border-color:transparent}

/* inputs */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field > .lab{font-size:14px;font-weight:700;color:var(--ink)}
.field > .hint{font-size:13px;color:var(--ink-2)}
.inp,.sel{height:44px;width:100%;min-width:0;padding:0 12px;border:1.5px solid var(--field);border-radius:10px;background:var(--surface);color:var(--ink);font:400 15px var(--f)}
textarea.inp{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}
.inp:hover,.sel:hover{border-color:var(--field-hover)}
.inp:focus,.sel:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 3px var(--action-soft)}
.inp::placeholder{color:var(--ink-3)}
.inp.sm,.sel.sm{height:36px;font-size:14px;padding:0 10px;border-radius:9px}
.inp.code{font-family:var(--f-code);font-weight:500}
.inp:disabled,.sel:disabled{background:var(--tint);border-color:var(--rule);color:var(--ink-2)}
.sel.auto{width:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.check{display:inline-flex;align-items:center;gap:10px;min-height:32px;font-size:15px;color:var(--ink);cursor:pointer}
.check input{width:19px;height:19px;margin:0;flex:none;accent-color:var(--action);cursor:pointer}
.check.al-top{align-items:flex-start}
.check.al-top input{margin-top:2px}
.checks{display:flex;flex-wrap:wrap;gap:4px 22px}
.checks.col{flex-direction:column;gap:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--field);border-radius:12px;background:var(--surface);cursor:pointer}
.opt:hover{border-color:var(--field-hover);background:var(--subtle)}
.opt input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--action);cursor:pointer}
.opt b{display:block;font-size:15px;font-weight:700}
.opt small{display:block;font-size:13px;line-height:1.4;color:var(--ink-2)}
.opt.on{border-color:var(--action);background:var(--action-soft)}
.opt.dis{opacity:.5;cursor:not-allowed}
.opt:focus-within{outline:2.5px solid var(--action);outline-offset:2px}
.seg{display:inline-flex;padding:4px;gap:4px;border-radius:12px;background:var(--tint)}
.seg button{height:36px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:var(--ink-2);font:600 14.5px var(--f);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .14)}
.seg button:disabled{opacity:.45;cursor:not-allowed}

/* status: coloured dot + word */
.st{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--dot);flex:none}
.st.todo{color:var(--ink-3);--dot:var(--d-todo)}
.st.doing{color:var(--ink);--dot:var(--d-doing)}
.st.review{color:var(--wait);--dot:var(--d-review)}
.st.fix{color:var(--bad);--dot:var(--d-fix)}
.st.done{color:var(--ok);--dot:var(--d-done)}
.st.sm{font-size:13px}

/* page frame */
.wrap{max-width:1320px;margin:0 auto;padding-block:30px 84px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap}
.ph p{margin-top:8px;max-width:68ch;color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel.flush{padding:0;overflow:hidden;gap:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.panel.flush > .panel-h{padding:18px 22px 14px}
.banner{padding:12px 16px;border-radius:12px;background:var(--action-soft);font-size:14.5px}
.banner.warn{background:var(--wait-soft)}
.empty{padding:20px;border:1.5px dashed var(--field);border-radius:14px;color:var(--ink-2);font-size:15px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.boot{min-height:46vh;display:flex;align-items:center;justify-content:center;padding:24px}
.boot-card{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;color:var(--ink-2)}
.boot-card b{color:var(--ink);font-size:17px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.lg{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:13px;border-radius:4px;display:inline-block;flex:none}
.sw.todo{background:var(--c-todo)} .sw.doing{background:var(--c-doing)} .sw.review{background:var(--c-review)} .sw.fix{background:var(--c-fix)} .sw.done{background:var(--c-done)}
.sw.late{background:var(--surface);box-shadow:inset 0 0 0 2px var(--d-fix)}
.sw.dl{width:3px;height:16px;background:var(--d-fix);border-radius:2px}
.sw.today{background:color-mix(in oklab,var(--action) 14%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--action)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:13px;font-weight:600;color:var(--ink-2);padding:11px 16px;background:var(--subtle);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right}
.tbl td.bad{color:var(--bad);font-weight:700}
.tbl td.strong{font-weight:700}
.tbl .cell-actions{margin-top:8px}

/* attention row */
.attn{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.attn .btn{gap:9px}
.badge-n{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:12px;font-size:13px;font-weight:800;background:var(--tint);color:var(--ink)}
.badge-n.wait{background:var(--d-review);color:var(--on-wait)}
.badge-n.bad{background:var(--bad);color:var(--on-action)}
.calm{font-size:15px;color:var(--ink-2)}

/* month board */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.mnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mnav h1{min-width:205px;text-align:center}
.board{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:16px}
.cal{min-width:calc(var(--namew) + var(--nd) * var(--dayw))}
.crow{display:grid;grid-template-columns:var(--namew) repeat(var(--nd),minmax(var(--dayw),1fr))}
.cname{position:sticky;left:0;z-index:3;grid-column:1;background:var(--surface);border-right:1px solid var(--rule);padding:10px 16px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.dhead{border-bottom:1.5px solid var(--field)}
.dhead .cname{justify-content:flex-end;font-size:13px;font-weight:600;color:var(--ink-2)}
.dh{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-block:8px;border-left:1px solid var(--rule)}
.dh b{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.dh small{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.dh.we{background:var(--subtle)}
.dh.td{background:color-mix(in oklab,var(--action) 12%,var(--surface));box-shadow:inset 1.5px 0 0 var(--action),inset -1.5px 0 0 var(--action)}
.dh.td b{background:var(--action);color:var(--on-action)}
.dh.td small{color:var(--action);font-weight:800}
.pblock{border-top:1.5px solid var(--field)}
.pblock:first-of-type{border-top:0}
.phead{grid-template-rows:minmax(54px,auto);background:var(--subtle)}
.phead .cname{background:var(--subtle)}
.pn{font-size:16px;font-weight:800}
.cname small{font-size:13px;color:var(--ink-2);line-height:1.35}
.you{font-size:13px;font-weight:700;color:var(--action)}
.heat{grid-row:1;border:0;border-left:1px solid var(--rule);background:transparent;font:700 13px/1 var(--f);font-variant-numeric:tabular-nums;color:var(--ink-2);cursor:pointer;padding:0;min-width:0}
.heat.we{background:var(--tint)}
.heat.l1{background:var(--heat1);color:var(--ink)}
.heat.l2{background:var(--heat2);color:var(--ink)}
.heat.l3{background:var(--heat3);color:var(--bad);font-weight:800}
.heat.off{background:repeating-linear-gradient(135deg,var(--rule) 0 3px,transparent 3px 7px);font:600 11px/1 var(--f);color:var(--ink-2)}
.heat.td{box-shadow:inset 1.5px 0 0 var(--action),inset -1.5px 0 0 var(--action)}
.heat:hover{outline:2px solid var(--field-hover);outline-offset:-2px}
.sub{border-top:1px solid var(--rule)}
.sub .cname{padding-left:30px}
.sub.proj .cname{padding-left:16px}
.pname{font-size:14.5px;font-weight:600;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.pname:hover{color:var(--action)}
.cday{border-left:1px solid var(--rule)}
.cday.we{background:var(--subtle)}
.cday.off{background:repeating-linear-gradient(135deg,var(--tint) 0 4px,transparent 4px 8px)}
.cday.td{background:color-mix(in oklab,var(--action) 7%,var(--surface));box-shadow:inset 1.5px 0 0 var(--action),inset -1.5px 0 0 var(--action)}
.dlx{z-index:2;justify-self:end;width:3px;margin-right:-2px;background:var(--d-fix);border-radius:2px}
.sb{position:relative;z-index:1;align-self:center;height:28px;margin:0 2px;padding:0 6px;border:0;border-radius:7px;background:var(--c-todo);color:var(--ink);font:600 13px/28px var(--f);text-align:left;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:0}
.sb.doing{background:var(--c-doing)}
.sb.review{background:var(--c-review)}
.sb.fix{background:var(--c-fix)}
.sb.done{background:var(--c-done);color:var(--ink-2)}
.sb.nopipe{background:repeating-linear-gradient(135deg,var(--c-nopipe) 0 6px,transparent 6px 12px);color:var(--ink-3);font-weight:500;box-shadow:inset 0 0 0 1px var(--field)}
.sb.late{box-shadow:inset 0 0 0 2px var(--d-fix)}
.sb:hover{filter:brightness(.94)}
.sb.cutl{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.sb.cutr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.sbx{position:relative;z-index:1;align-self:center;display:flex;align-items:center;gap:6px;height:28px;min-width:0;padding:0;border:0;background:transparent;color:var(--ink);font:600 13px/28px var(--f);text-align:left;white-space:nowrap;cursor:pointer}
.sbx.l{justify-content:flex-end}
.sbx.done{color:var(--ink-2)}
.sbx > span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sbx:hover > span{text-decoration:underline;text-underline-offset:3px}
.sbx:hover .sbar{filter:brightness(.94)}
.sbar{position:relative;flex:0 0 auto;display:flex;height:28px;margin:0 2px;border-radius:7px;overflow:hidden}
.sbar b{flex:1 1 0;background:var(--c-todo)}
.sbar b.doing{background:var(--c-doing)}
.sbar b.review{background:var(--c-review)}
.sbar b.fix{background:var(--c-fix)}
.sbar b.done{background:var(--c-done)}
.sbar em{position:absolute;inset:0;padding:0 6px;font-style:normal;overflow:hidden;text-overflow:ellipsis}

/* Job ID trong form dự án */
.jid-parts{display:grid;grid-template-columns:136px 104px minmax(0,1fr);gap:10px;align-items:end}
.jid-parts label{display:flex;flex-direction:column;gap:4px;min-width:0}
.jid-fixed{display:flex;align-items:center;height:44px;padding:0 12px;border-radius:10px;background:var(--tint);color:var(--ink);font-size:15px}
.nc-row{margin-top:8px}
@media (max-width:560px){.jid-parts{grid-template-columns:1fr 1fr}.jid-parts .grow{grid-column:1 / -1}}
/* danh sách khách trong Cài đặt */
.cl-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px 18px;padding:0 22px 16px}
.cl-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 22px 0}
.cl-add .inp{width:auto;flex:1 1 160px}
.cl-add .inp.code{flex:0 0 96px}
.cl-bulk{display:flex;flex-direction:column;gap:10px;padding:12px 22px 0}
.cl-models{display:flex;flex-direction:column;gap:10px;padding:18px 22px 20px;border-top:1px solid var(--rule);margin-top:16px}
.cl-models h3{font-size:15px}
.cl-models .cl-add{padding:0}
.mc-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.mc-list li{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 11px;border-radius:9px;background:var(--tint);font-size:14px}
/* trang Đặt tên file */
.nm-job-pick{display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);gap:16px 24px;align-items:start}
.nm-job-pick .field .inp{margin-top:8px}
.nm-job-info{display:flex;flex-direction:column;gap:10px;min-width:0;padding-top:26px}
.nm-path{display:flex;flex-direction:column;gap:2px;min-width:0}
.nm-path .code{font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
.nm-rail{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.nm-f{flex:none;height:40px;padding:0 13px;border:1.5px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink-2);font:inherit;cursor:pointer}
.nm-f .code{font-size:14px}
.nm-f:hover{border-color:var(--field-hover);color:var(--ink)}
.nm-f[aria-pressed="true"]{border-color:var(--action);background:var(--action);color:var(--on-action)}
.nm-grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1001px){.nm-grid2 > section:last-child{position:sticky;top:88px}}
.nm-fmt{display:flex;flex-direction:column;gap:6px}
.nm-fmt code{font:600 14px var(--f-code);padding:10px 12px;border-radius:10px;background:var(--action-soft);color:var(--action);overflow-wrap:anywhere}
.nm-chips{display:flex;flex-wrap:wrap;gap:6px}
.nm-chip{display:flex;align-items:baseline;gap:6px;min-height:36px;padding:6px 11px;border:1.5px solid var(--field);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.nm-chip small{font-size:12.5px;color:var(--ink-2)}
.nm-chip[aria-pressed="true"]{border-color:var(--action);background:var(--action-soft)}
.nm-out{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:420px;overflow:auto}
.nm-out li{display:flex;align-items:center;gap:8px;min-width:0}
.nm-out code{flex:1 1 auto;min-width:0;padding:7px 10px;border-radius:8px;background:var(--tint);font:600 13.5px var(--f-code);color:var(--ink);overflow-wrap:anywhere}
.nm-out.dirs code{font-weight:500}
.nm-chk{min-height:96px;height:auto;padding:10px 12px;font:500 14px var(--f-code);resize:vertical}
.nm-res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.nm-res li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:9px;background:var(--subtle)}
.nm-res li.ok svg{color:var(--ok)}
.nm-res li.bad{background:var(--bad-soft)}
.nm-res li.bad svg{color:var(--bad)}

.sb-folder{display:block;margin-top:4px}

.reg-conn.bad{background:var(--bad-soft)}

.rj-list li > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.rj-list .code{overflow-wrap:anywhere}

.in-flow li::before{content:counter(f);position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--action-soft);color:var(--action);font-weight:800;font-size:13px}
.in-flow b{font-size:14.5px;color:var(--ink)}
.in-list{display:flex;flex-direction:column}
.in-card{display:flex;flex-direction:column;gap:8px;padding:16px 22px;border-top:1px solid var(--rule)}

.in-h h3{font-size:16.5px;font-weight:700}
.in-due{font-size:14px;color:var(--ink-2)}
.in-tags{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.in-tag{padding:1px 9px;border-radius:999px;background:var(--tint);font-size:13px;font-weight:600;color:var(--ink-2)}
.in-brief{white-space:pre-wrap;max-width:90ch;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.in-extra{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px}
.in-ask{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.in-ask .inp{flex:1 1 240px;width:auto}
.in-empty{padding:0 22px 20px}
.in-done{list-style:none;margin:0;padding:0}
.in-done li{display:flex;flex-direction:column;gap:6px;padding:14px 22px;border-top:1px solid var(--rule)}
.in-done-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.in-done .reg-box{align-self:flex-start}
.in-form{display:flex;flex-direction:column;gap:16px}
.in-form textarea.inp{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}

.who-row.on{border-color:var(--action);background:var(--action-soft)}

.signup-cta > div{display:flex;flex-direction:column;gap:2px}
.cl-last{padding-bottom:20px}
.jid-seq{display:flex;flex-direction:column;gap:4px}

const wq = {};
function wdoc(path, op, beforeLogin){

  const run = () => op(S.db.doc(path));
  const p = (wq[path] || Promise.resolve()).then(() => run().catch(e => {
    if(e && e.code === 'unavailable') return new Promise(r => setTimeout(r, 500 + Math.random()*700)).then(run);
    throw e;
  })).then(() => true, e => { writeErr(e); return false; });

}
function writeErr(e){
  const c = e && e.code;

  else if(c === 'quota_exceeded') toast('Bộ nhớ dữ liệu đã đầy ('+(e.message||'')+'). Xóa bớt dự án cũ rồi thử lại.', 'bad');

}

/* Mã PIN 4 số: lưu dạng băm SHA-256 kèm salt trong staff/{id}.pin = {h, s, at}. */
async function pinHash(sid, salt, pin){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mx-pin|'+sid+'|'+salt+'|'+pin));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function hasPin(sid){ const p = S.staff[sid] && S.staff[sid].pin; return !!(p && p.h && p.s); }
async function pinOk(sid, pin){ if(!hasPin(sid)) return false; const p = S.staff[sid].pin; return (await pinHash(sid, p.s, pin)) === p.h; }
async function setPinFor(sid, pin){
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b => b.toString(16).padStart(2, '0')).join('');
  const np = {h: await pinHash(sid, salt, pin), s: salt, at: Date.now()};
  const had = hasPin(sid), by = meId() || sid, nm = (S.staff[sid] && S.staff[sid].name) || sid;
  const ok = await wdoc('staff/'+sid, r => r.update({pin: np}), true);
  if(ok){ S.staff[sid] = Object.assign({}, S.staff[sid], {pin: np}); emit(); logPut([{t: 'login', text: by !== sid ? (had ? 'đổi mã PIN của ' : 'tạo mã PIN cho ')+nm : had ? 'đổi mã PIN' : 'tạo mã PIN lần đầu'}], by); }
  return ok ? np : null;
}

}

function reservedOf(b){ return b.status === 'open' ? Math.max(b.est, b.used) : b.used; }

function enrichStep(def, raw, t, reviewers){
  const st = Object.assign({}, raw, {id: def.id, def});
  st.who = Array.isArray(raw.who) ? raw.who.filter(Boolean) : [];
  st.ver = +raw.ver || 0;
  const revIds = reviewers.map(r => r.id);
  st.qcBy = Array.isArray(raw.qcBy) ? raw.qcBy.filter(r => revIds.indexOf(r) >= 0) : revIds;
  const qc = raw.qc || {};
  st.fixOn = !!(st.ver > 0 && raw.fix && (+raw.fix.ver||0) === st.ver);
  /* quyết định mới nhất thắng: lượt duyệt trước một yêu cầu sửa cùng bản thì không tính */
  const fixAt = st.fixOn ? (+raw.fix.at || 0) : 0;
  st.approvedBy = st.qcBy.filter(r => st.ver > 0 && qc[r] && qc[r].ok && (+qc[r].ver||0) === st.ver && (+qc[r].at||0) >= fixAt);
  /* Một người trong danh sách duyệt (Hiếu hoặc Hào) duyệt bản hiện tại là bước xong */
  st.waitBy = st.approvedBy.length ? [] : st.qcBy.slice();
  st.comments = Object.keys(raw.cm||{}).filter(k => raw.cm[k] && raw.cm[k].text).map(k => Object.assign({cid:k}, raw.cm[k])).sort((a,b) => (a.at||0) - (b.at||0));
  st.hist = raw.vh || {};
  st.prev = [];
  for(let v = st.ver - 1; v >= 1; v--) st.prev.push({v, h: st.hist['v'+v] || null, fx: st.comments.filter(c => c.kind === 'fix' && (+c.ver || 0) === v).slice(-1)[0] || null});
  st.vnotes = Object.keys(raw.vn||{}).filter(k => raw.vn[k] && typeof raw.vn[k].t === 'number').map(k => Object.assign({nid:k}, raw.vn[k])).sort((a,b) => (a.t - b.t) || ((a.at||0) - (b.at||0)));
  if(!raw.link) st.state = (raw.start && raw.start <= t) ? 'doing' : 'todo';
  else if(st.approvedBy.length || !st.qcBy.length) st.state = 'done';
  else if(st.fixOn) st.state = 'fix';
  else st.state = 'review';
  st.late = st.state !== 'done' && !!raw.end && raw.end < t;
  return st;
}
function enrich(id, raw, t, cfg, reviewers){
  const p = Object.assign({}, raw, {id});
  p.status = P_STATUS[raw.status] ? raw.status : 'active';
  p.tier = TIERS[raw.tier] ? raw.tier : '';

  p.name = raw.name || 'Dự án chưa đặt tên';
  const pj = parseJob(p.code); p.jobOk = !!pj; p.tag = pj ? pj.cc+'_'+pj.pn : p.code ? p.code.split('-').slice(2).join('-') : p.name;
  p.parent = raw.parent || '';
  p.color = (raw.c >= 1 && raw.c <= 7) ? raw.c : hashSlot(id);
  const sr = raw.steps || {};
  p.steps = STEPS.filter(d => sr[d.id] && sr[d.id].on).map(d => enrichStep(d, sr[d.id], t, reviewers));
  p.total = p.steps.length;
  p.doneN = p.steps.filter(s => s.state === 'done').length;
  p.cur = p.steps.find(s => s.state !== 'done') || null;
  p.closed = p.status === 'done' || p.status === 'cancelled';
  p.late = !!(p.deadline && p.deadline < t && !p.closed);
  p.daysLeft = p.deadline ? diffDays(t, p.deadline) : null;
  const bk = raw.bookings || {};
  p.bookings = Object.keys(bk).filter(k => bk[k]).map(bid => {
    const b = bk[bid];
    const usage = Object.keys(b.usage||{}).filter(k => b.usage[k]).map(k => Object.assign({uid:k}, b.usage[k])).sort((x,y) => (x.date||'').localeCompare(y.date||'') || (x.at||0) - (y.at||0));
    const status = p.status === 'cancelled' ? 'cancelled' : (p.status === 'done' && b.status !== 'cancelled') ? 'done' : (b.status === 'done' || b.status === 'cancelled' ? b.status : 'open');
    return Object.assign({}, b, {bid, pid:id, p, usage, used: sum(usage.map(u => u.n)), status, est: +b.est || 0});
  }).sort(cmpBooking);
  p.est = sum(p.bookings.filter(b => b.status !== 'cancelled').map(b => b.est));
  p.used = sum(p.bookings.map(b => b.used));
  const gr = raw.gates || {};
  p.gates = (p.tier ? TIERS[p.tier].gates : []).map(gid => Object.assign({}, GATES[gid], gr[gid] || {}, {id: gid, na: gid === 'g0' && raw.useCase === 'INT'}));
  const shr = raw.shares || {};
  p.shareList = Object.keys(shr).filter(k => shr[k] && shr[k].sid).map(k => Object.assign({tok: k}, shr[k])).sort((a, b) => (b.at || 0) - (a.at || 0));
  p.steps.forEach(st => {
    st.shares = p.shareList.filter(x => x.sid === st.id);
    st.cdec = st.shares.filter(x => x.dec && x.dec.at).map(x => Object.assign({tok: x.tok}, x.dec)).sort((a, b) => b.at - a.at)[0] || null;
  });
  p.revs = Object.keys(raw.revs||{}).filter(k => raw.revs[k]).map(k => Object.assign({rid:k}, raw.revs[k])).sort((a,b) => (a.at||0) - (b.at||0));
  p.revAllowed = (raw.revAllowed === 0 || raw.revAllowed) ? +raw.revAllowed : null;
  p.pay = raw.useCase === 'EXT' && (p.tier === 'A' || (+raw.value||0) >= cfg.payMin);
  p.gates.forEach(g => {
    g.violated = false; g.soft = false;
    if(g.na || g.ok) return;
    const ai = STEP_ORDER.indexOf(g.after);
    const later = p.steps.filter(s => STEP_ORDER.indexOf(s.id) > ai);
    const started = later.filter(s => s.link);
    if(started.length){ g.violated = true; g.vText = 'Bước '+started.map(s => s.def.no).join(', ')+' đã nộp khi gate chưa xác nhận'; g.vShort = 'Chưa xác nhận, bước '+started.map(s => s.def.no).join(', ')+' đã nộp'; return; }
    if(p.closed) return;
    const next = later.find(s => s.start);
    if(next && next.start <= t){ g.violated = true; g.soft = g.id !== 'g0'; g.vText = g.id === 'g0' ? 'Đã tới lịch sản xuất nhưng chưa có HĐ + cọc' : 'Đã tới lịch bước '+next.def.no+' nhưng gate chưa xác nhận'; g.vShort = g.id === 'g0' ? 'Chưa có HĐ + cọc, đã tới lịch sản xuất' : 'Chưa xác nhận, đã tới lịch bước '+next.def.no; }
  });
  return p;
}
function accMetrics(a, bookings, t, cfg){
  const rd = Math.min(31, Math.max(1, toInt(a.resetDay) || 1));
  const per = periodFor(rd, t);
  const inPer = bookings.filter(b => b.acc === a.id && b.date && b.date >= per.start && b.date < per.end);
  const reserved = sum(inPer.map(reservedOf));
  const used = sum(inPer.map(b => b.used));
  const topup = a.topupFrom === per.start ? (+a.topup || 0) : 0;
  const base = (+a.perPeriod || 0) + topup;
  const cap = base - cfg.buffer;
  const balOk = a.balance !== null && a.balance !== undefined && a.balance !== '' && !!a.balanceAt && a.balanceAt >= per.start && a.balanceAt < per.end;
  const unlogged = balOk ? Math.max(0, base - (+a.balance) - used) : 0;
  const bookable = cap - reserved - unlogged;
  const state = a.active === false ? 'off' : bookable <= 0 ? 'lock' : bookable < cfg.nearFull ? 'near' : 'open';
  return {rd, per, inPer, reserved, used, topup, base, cap, balOk, unlogged, bookable, state, daysLeft: diffDays(t, per.end)};
}
function bookingCheck(b, ctx){
  const a = ctx.amap[b.acc];
  if(!(b.est > 0)) return {k:'THIẾU ƯỚC LƯỢNG'};
  if(!b.date) return {k:'THIẾU NGÀY BOOK'};
  if(!a) return {k:'CHƯA CHỌN ACC'};
  const per = periodFor(a.m.rd, b.date);
  b.per = per;
  const list = ctx.bookings.filter(x => x.acc === a.id && x.date && x.date >= per.start && x.date < per.end).sort(cmpBooking);
  let cum = 0; for(const x of list){ cum += reservedOf(x); if(x.pid === b.pid && x.bid === b.bid) break; }
  b.cum = cum;
  if(b.status === 'done') return {k:'ĐÃ XONG'};
  if(b.status === 'cancelled') return {k:'ĐÃ HỦY'};
  if(a.scope === 'ext' && b.p.useCase === 'INT') return {k:'ACC CHỈ CHO EXT'};
  if(per.end <= ctx.t) return {k:'QUA KỲ RESET'};
  const isCur = per.start === a.m.per.start;
  const cap = (+a.perPeriod || 0) + (isCur ? a.m.topup : 0) - ctx.cfg.buffer;
  if(cum + (isCur ? a.m.unlogged : 0) > cap) return {k:'VƯỢT CAP'};
  if(!b.approved) return {k:'CHỜ DUYỆT'};
  return {k:'OK'};
}
function suggestAcc(D, useCase, need, date, excl){
  const rows = []; let best = null;
  D.accounts.forEach(a => {
    if(a.active === false) return;
    const per = periodFor(a.m.rd, date || D.t);
    const isCur = per.start === a.m.per.start;
    const list = D.bookings.filter(x => x.acc === a.id && x.date && x.date >= per.start && x.date < per.end && !(excl && x.pid === excl.pid && x.bid === excl.bid));
    const cap = (+a.perPeriod || 0) + (isCur ? a.m.topup : 0) - D.cfg.buffer;
    const room = cap - sum(list.map(reservedOf)) - (isCur ? a.m.unlogged : 0);
    const okScope = !(a.scope === 'ext' && useCase === 'INT');
    const fits = okScope && room >= (need || 0) && room > 0;
    const r = {a, room, per, okScope, fits};
    rows.push(r);
    if(fits && (!best || room > best.room)) best = r;
  });
  return {best, rows};
}
function finishAlerts(p, codeCount){
  const al = [];

  p.gates.forEach(g => { if(g.violated) al.push({tone: g.soft ? 'warn' : 'bad', text: g.id === 'g0' ? 'Chưa qua G0: '+g.vText.toLowerCase() : g.label.split(' ·')[0]+': '+g.vText.toLowerCase()}); });
  if(p.est > 0 && p.used > p.est) al.push({tone:'bad', text:'Đã vượt credit dự kiến '+fN(p.used - p.est)+' credit'});
  if(!p.closed && p.tier && !p.bookings.length) al.push({tone:'warn', text:'Chưa book credit Higgsfield'});
  p.bookings.forEach(b => {
    if(b.status !== 'open') return;
    const k = b.chk.k;
    if(k === 'VƯỢT CAP') al.push({tone:'bad', text:'Account đã vượt cap, cần đổi account'});
    else if(k === 'CHỜ DUYỆT') al.push({tone:'warn', text:'Booking credit chờ Hào duyệt'});
    else if(k === 'ACC CHỈ CHO EXT') al.push({tone:'bad', text:'Account chỉ dành cho job khách'});
    else if(k === 'QUA KỲ RESET') al.push({tone:'warn', text:'Booking đã qua kỳ reset, cần tách sang kỳ mới'});
    else if(k === 'CHƯA CHỌN ACC' || k === 'THIẾU ƯỚC LƯỢNG') al.push({tone:'warn', text:'Booking credit thiếu thông tin'});
  });
  if(p.revAllowed !== null && p.revs.length > p.revAllowed) al.push({tone:'bad', text:'Vòng sửa '+p.revs.length+'/'+p.revAllowed+', vượt số vòng trong HĐ'});
  const lateN = p.steps.filter(s => s.late).length;
  if(lateN && !p.closed) al.push({tone:'warn', text: lateN+' bước trễ lịch'});
  p.steps.forEach(st => { if(st.cdec && !st.cdec.ok && (+st.cdec.ver || 0) === st.ver) al.push({tone:'warn', text:'Khách yêu cầu sửa '+st.def.no+' '+st.def.name+' '+vTag(st.ver)}); });
  const fixN = p.steps.filter(s => s.state === 'fix').length;
  if(fixN) al.push({tone:'warn', text: fixN+' bước đang cần sửa'});
  const seen = {}; p.alerts = al.filter(a => seen[a.text] ? false : (seen[a.text] = true));
}
function buildActivity(projects){

      Object.keys(st.qc||{}).forEach(r => { const q = st.qc[r]; if(q && q.ok && q.at) ev.push({t:q.at, who:r, p, text:'duyệt '+st.def.no+' '+st.def.name+' '+vTag(q.ver)}); });
      st.comments.forEach(c => ev.push({t:c.at, who:c.by, p, text:(c.kind === 'fix' ? 'yêu cầu sửa ' : 'góp ý ')+st.def.no+': “'+(c.text.length > 70 ? c.text.slice(0,68)+'…' : c.text)+'”'}));
    });
    p.gates.forEach(g => { if(g.ok && g.at) ev.push({t:g.at, who:g.by, p, text:'xác nhận '+g.label}); });

function derive(){
  const t = today();
  const cfg = Object.assign({}, DEF_CFG, S.config || {});
  ['buffer','nearFull','unloggedWarn','revDefault','payMin'].forEach(k => { cfg[k] = +cfg[k] || 0; });
  const allStaff = Object.keys(S.staff).map(id => Object.assign({id}, S.staff[id])).sort((a,b) => (a.order||99) - (b.order||99) || String(a.name).localeCompare(String(b.name)));
  const staffList = allStaff.filter(s => s.kind !== 'req');
  const reqList = allStaff.filter(s => s.kind === 'req');
  const staffMap = {}; allStaff.forEach(s => { staffMap[s.id] = s; });
  const reviewers = staffList.filter(s => s.qc && s.active !== false);
  const projects = Object.keys(S.projects).map(id => enrich(id, S.projects[id], t, cfg, reviewers));
  const pmap = {}; projects.forEach(p => { pmap[p.id] = p; });
  const codeCount = {}; projects.forEach(p => { if(p.code) codeCount[p.code] = (codeCount[p.code]||0) + 1; });
  const bookings = []; projects.forEach(p => p.bookings.forEach(b => bookings.push(b)));
  const accounts = Object.keys(S.accounts).map(id => Object.assign({id}, S.accounts[id])).sort((a,b) => (a.order||99) - (b.order||99) || String(a.code||'').localeCompare(String(b.code||'')));
  const amap = {}; accounts.forEach(a => { amap[a.id] = a; a.m = accMetrics(a, bookings, t, cfg); });
  const ctx = {t, cfg, bookings, amap};
  bookings.forEach(b => { b.chk = bookingCheck(b, ctx); });
  projects.forEach(p => finishAlerts(p, codeCount));
  const rank = p => p.closed ? 2 : p.status === 'hold' ? 1 : 0;
  projects.sort((a,b) => rank(a) - rank(b) || (rank(a) === 2 ? (b.deadline||'').localeCompare(a.deadline||'') : (a.deadline||'9').localeCompare(b.deadline||'9')));
  const allSteps = [];
  projects.forEach(p => { if(p.status === 'cancelled') return; p.steps.forEach(st => allSteps.push({p, st})); });
  const qcPending = [];
  allSteps.forEach(x => { if(!x.st.link || x.st.state === 'done' || x.st.state === 'fix') return; x.st.qcBy.forEach(r => { if(x.st.approvedBy.indexOf(r) < 0) qcPending.push({p:x.p, st:x.st, reviewer:r}); }); });
  qcPending.sort((a,b) => (a.st.subAt||0) - (b.st.subAt||0));
  return {t, cfg, staffList, reqList, staffMap, reviewers, projects, pmap, bookings, accounts, amap, allSteps, qcPending, activity: buildActivity(projects)};

  return html`<input ref=${ref} class=${'inp sm'+(mono ? ' code' : '')} value=${v} placeholder=${placeholder || ''} aria-label=${placeholder || 'Nhập'} onInput=${e => setV(e.target.value)} onBlur=${() => finish(String(v).trim())} onKeyDown=${e => { if(e.key === 'Enter') finish(String(v).trim()); if(e.key === 'Escape') finish(value || ''); }}/>`;
}
function InlineText({value, placeholder, onSave, cls, label, disabled}){
  const [v, setV] = useState(value || '');
  const focused = useRef(false), cancel = useRef(false);
  useEffect(() => { if(!focused.current) setV(value || ''); }, [value]);
  const commit = () => { focused.current = false; if(cancel.current){ cancel.current = false; setV(value || ''); return; } const nv = String(v).trim(); if(nv !== String(value || '')) onSave(nv); };
  return html`<input class=${'inp sm '+(cls || '')} value=${v} placeholder=${placeholder || ''} aria-label=${label || placeholder || ''} disabled=${disabled || !canW()}
    onFocus=${() => { focused.current = true; }} onInput=${e => setV(e.target.value)} onBlur=${commit}
    onKeyDown=${e => { if(e.key === 'Enter') e.target.blur(); if(e.key === 'Escape'){ cancel.current = true; e.target.blur(); } }}/>`;
}
function InlineNum({value, placeholder, onSave, label, disabled}){
  return html`<${InlineText} value=${value === null || value === undefined ? '' : String(value)} placeholder=${placeholder || '0'} cls="num" label=${label} disabled=${disabled}
    onSave=${v => { if(v === ''){ onSave(null); return; } const n = toInt(v); if(n === null){ toast('Cần nhập số.', 'warn'); return; } onSave(n); }}/>`;
}
function Modal({title, onClose, wide, flush, children}){

/* ---------- date range picker ---------- */
const WD_LONG = ['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
function addMonths(ym, k){ const d = new Date(+ym.slice(0,4), +ym.slice(5,7) - 1 + k, 1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function workDays(a, b){ if(!a || !b || b < a) return 0; let n = 0; for(let x = a; x <= b; x = addDays(x, 1)){ const w = parse(x).getDay(); if(w !== 0 && w !== 6) n++; } return n; }
function monthCells(ym){
  const y = +ym.slice(0,4), m = +ym.slice(5,7) - 1;
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  const cells = []; for(let i = 0; i < lead; i++) cells.push(null);
  const nd = monthDays(y, m); for(let d = 1; d <= nd; d++) cells.push(ym+'-'+pad(d));
  while(cells.length % 7) cells.push(null);
  return cells;
}
function DateRange({start, end, onChange, labels}){
  const L = labels || ['Bắt đầu', 'Kết thúc'];
  const [open, setOpen] = useState(null);
  const [draft, setDraft] = useState({s: start || '', e: end || ''});
  const [hover, setHover] = useState('');
  const [view, setView] = useState((start || today()).slice(0,7));
  const ref = useRef(null); const popRef = useRef(null);
  useEffect(() => { if(!open) setDraft({s: start || '', e: end || ''}); }, [start, end, open]);
  useEffect(() => { if(open && popRef.current && popRef.current.scrollIntoView) popRef.current.scrollIntoView({block: 'nearest'}); }, [!!open]);
  const commit = (s, e) => { if(s && e && (s !== (start || '') || e !== (end || ''))) onChange(s, e); };
  const close = () => { if(draft.s) commit(draft.s, draft.e || draft.s); setOpen(null); setHover(''); };
  const closeRef = useRef(close); closeRef.current = close;
  useEffect(() => {
    if(!open) return;
    const onDown = ev => { if(ref.current && !ref.current.contains(ev.target)) closeRef.current(); };
    const onKey = ev => { if(ev.key === 'Escape'){ ev.stopPropagation(); closeRef.current(); } };
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey, true);
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey, true); };
  }, [open]);
  const openAt = which => {
    setDraft({s: start || '', e: end || ''});
    let v = (start || end || today()).slice(0,7);
    if(which === 'end' && end && end.slice(0,7) > addMonths(v, 1)) v = addMonths(end.slice(0,7), -1);
    setView(v); setHover(''); setOpen(which);
  };
  const pick = d => {
    if(open === 'start' || !draft.s){
      const e = draft.e && draft.e >= d ? draft.e : '';
      setDraft({s: d, e}); setOpen('end');
      if(e) commit(d, e);
    } else if(d < draft.s){
      setDraft({s: d, e: ''});
    } else {
      setDraft({s: draft.s, e: d}); commit(draft.s, d); setOpen(null); setHover('');
    }
  };
  const rEnd = open === 'end' && draft.s && hover && hover >= draft.s ? hover : draft.e;
  const isPrev = !!(open === 'end' && hover && hover >= (draft.s || '9') && hover !== draft.e);
  const hasRange = !!(draft.s && rEnd && rEnd > draft.s);
  const t = today();
  const dayCls = d => {
    const wd = parse(d).getDay();
    let c = 'drp-day';
    if(wd === 0 || wd === 6) c += ' we';
    if(d === t) c += ' today';
    if(d === draft.s || (!isPrev && d === draft.e)) c += ' sel';
    if(isPrev && d === rEnd) c += ' sel prev';
    if(hasRange){ if(d === draft.s) c += ' rs'; else if(d === rEnd) c += ' re'; else if(d > draft.s && d < rEnd) c += ' in'; if(isPrev) c += ' pv'; }
    return c;
  };
  const shownS = open ? draft.s : start, shownE = open ? draft.e : end;
  const fmt = d => d ? WD[parse(d).getDay()]+', '+fDY(d) : 'Chọn ngày';
  const n = shownS && shownE && shownE >= shownS ? diffDays(shownS, shownE) + 1 : 0;
  const which = open === 'start' ? L[0] : L[1];
  return html`<div class="drp" ref=${ref}>
    <div class="drp-fields">
      <button type="button" class=${'drp-field'+(open === 'start' ? ' on' : '')} aria-expanded=${open === 'start'} onClick=${() => open === 'start' ? close() : openAt('start')}><span><${Ic} n="cal" s=${14}/>${L[0]}</span><b class=${shownS ? '' : 'empty'}>${fmt(shownS)}</b></button>
      <span class="drp-sep" aria-hidden="true"><${Ic} n="right" s=${18}/></span>
      <button type="button" class=${'drp-field'+(open === 'end' ? ' on' : '')} aria-expanded=${open === 'end'} onClick=${() => open === 'end' ? close() : openAt('end')}><span><${Ic} n="cal" s=${14}/>${L[1]}</span><b class=${shownE ? '' : 'empty'}>${fmt(shownE)}</b></button>
    </div>
    ${!open && n ? html`<span class="hint">${n} ngày, gồm ${workDays(shownS, shownE)} ngày làm việc</span>` : null}
    ${open ? html`<div class="drp-pop" ref=${popRef} role="dialog" aria-label=${'Chọn '+which.toLowerCase()}>
      <div class="drp-head">
        <button type="button" class="icon-btn sm" aria-label="Tháng trước" onClick=${() => setView(addMonths(view, -1))}><${Ic} n="left" s=${16}/></button>
        <b>Chọn ${which.toLowerCase()}</b>
        <button type="button" class="icon-btn sm" aria-label="Tháng sau" onClick=${() => setView(addMonths(view, 1))}><${Ic} n="right" s=${16}/></button>
      </div>
      <div class="drp-months" onMouseLeave=${() => setHover('')}>
        ${[view, addMonths(view, 1)].map(ym => html`<div key=${ym} class="drp-month">
          <div class="drp-title">Tháng ${+ym.slice(5,7)}, ${ym.slice(0,4)}</div>
          <div class="drp-wd">${['T2','T3','T4','T5','T6','T7','CN'].map(w => html`<span key=${w}>${w}</span>`)}</div>
          <div class="drp-days">${monthCells(ym).map((d, i) => d ? html`<button key=${d} type="button" class=${dayCls(d)} aria-pressed=${d === draft.s || d === draft.e} aria-label=${WD_LONG[parse(d).getDay()]+', '+(+d.slice(8))+' tháng '+(+d.slice(5,7))+', '+d.slice(0,4)} onMouseEnter=${() => setHover(d)} onFocus=${() => setHover(d)} onClick=${() => pick(d)}><span>${+d.slice(8)}</span></button>` : html`<span key=${'x'+i}></span>`)}</div>
        </div>`)}
      </div>
      <div class="drp-foot"><span class="meta">${n ? html`<b>${n} ngày</b>, gồm ${workDays(shownS, shownE)} ngày làm việc (${fD(shownS)} – ${fD(shownE)})` : (draft.s ? 'Chọn ngày '+L[1].toLowerCase() : 'Chọn ngày '+L[0].toLowerCase())}</span><button type="button" class="btn sm primary" onClick=${close}>Xong</button></div>
    </div>` : null}
  </div>`;
}

/* ---------- month board ---------- */
function mkItem(p, st, a, b, mStart, mEnd, nd){ return {p, st, a: Math.max(0, diffDays(mStart, a)), b: Math.min(nd-1, diffDays(mStart, b)), cutL: a < mStart, cutR: b > mEnd}; }
function spanOf(p, t){ if(!p.start || !p.deadline) return null; const a = p.start <= p.deadline ? p.start : p.deadline; let b = p.start <= p.deadline ? p.deadline : p.start; if(p.late && t > b) b = t; return [a, b]; }
function buildPeople(D, days, mStart, mEnd, dw){
  const nd = days.length;
  return D.staffList.filter(s => s.active !== false).map(s => {
    const projects = [];
    D.projects.forEach(p => {
      if(p.status === 'cancelled') return;
      const items = [];
      if(p.steps.length){
        p.steps.forEach(st => { if(!st.start || !st.end || st.who.indexOf(s.id) < 0 || st.end < mStart || st.start > mEnd) return; items.push(mkItem(p, st, st.start, st.end, mStart, mEnd, nd)); });
      } else if((p.pic === s.id || (p.team && p.team[s.id])) && !p.closed){
        const sp = spanOf(p, D.t); if(sp && !(sp[1] < mStart || sp[0] > mEnd)) items.push(mkItem(p, null, sp[0], sp[1], mStart, mEnd, nd));
      }
      if(!items.length) return;
      const segs = rowSegs(items, 'people', D, dw || 32);
      projects.push({p, items, segs, lanes: placeSegs(segs, nd), first: Math.min.apply(null, items.map(i => i.a))});
    });
    projects.sort((a, b) => a.first - b.first || (a.p.deadline || '').localeCompare(b.p.deadline || ''));
    const off = s.off || {};
    const heat = days.map(d => { const set = new Set(); projects.forEach(pr => pr.items.forEach(it => { if(d.i < it.a || d.i > it.b) return; if(it.st && it.st.state === 'done' && d.s >= D.t) return; set.add(pr.p.id); })); return set.size; });
    return {s, projects, heat, off, jobs: projects.length, busy: heat.filter(n => n > 0).length, over: heat.filter(n => n >= 3).length, offN: days.filter(d => off[d.s]).length};
  });
}
function buildProjRows(D, days, mStart, mEnd, dw){
  const nd = days.length, rows = [];
  D.projects.forEach(p => {
    if(p.status === 'cancelled') return;
    const items = [];
    p.steps.forEach(st => { if(!st.start || !st.end || st.end < mStart || st.start > mEnd) return; items.push(mkItem(p, st, st.start, st.end, mStart, mEnd, nd)); });
    if(!p.steps.length && !p.closed){ const sp = spanOf(p, D.t); if(sp && !(sp[1] < mStart || sp[0] > mEnd)) items.push(mkItem(p, null, sp[0], sp[1], mStart, mEnd, nd)); }
    const dlIn = p.deadline && p.deadline >= mStart && p.deadline <= mEnd;
    if(!items.length && !dlIn) return;
    const segs = rowSegs(items, 'projects', D, dw || 32);
    rows.push({p, items, segs, lanes: placeSegs(segs, nd)});
  });
  return rows;
}
function Seg({it, D}){

    const who = st.who.map(w => nameOf(D, w)).join(', ');
    title = p.name+'\n'+st.def.no+' '+st.def.name+': '+stepStatus(st, D).text+(st.late ? ' (trễ lịch)' : '')+'\n'+fD(st.start)+' – '+fD(st.end)+(who ? '\nNgười làm: '+who : '');
    cls = 'sb '+st.state+(st.late ? ' late' : '');
  } else {
    title = p.name+'\nChưa lập pipeline, '+fD(p.start)+' – '+fD(p.deadline)+(p.late ? ', quá hạn' : '');
    cls = 'sb nopipe'+(p.late ? ' late' : '');
  }
  return html`<button type="button" class=${cls+(it.cutL ? ' cutl' : '')+(it.cutR ? ' cutr' : '')} style=${'grid-row:'+(it.lane+1)+';grid-column:'+(it.a+2)+' / '+(it.b+3)} title=${title} aria-label=${title.replace(/\n/g, ', ')} onClick=${() => openJob(p.id, st && st.id)}>${it.lab}</button>`;
}
function ClusterSeg({sg, D}){
  const span = sg.b - sg.a + 1, out = sg.side ? sg.ext : 0, tot = span + out;
  const c0 = sg.side === 'l' ? sg.a - out : sg.a, c1 = sg.side === 'r' ? sg.b + out : sg.b;
  const cells = []; for(let d = sg.a; d <= sg.b; d++){ let best = null; sg.parts.forEach(x => { if(d >= x.a && d <= x.b && (!best || URG[x.st.state] > URG[best.st.state])) best = x; }); cells.push(best ? best.st.state : 'todo'); }
  const late = sg.parts.some(x => x.st.late), done = sg.parts.every(x => x.st.state === 'done');
  const title = sg.p.name+'\n'+sg.parts.map(x => x.st.def.no+' '+x.st.def.name+': '+stepStatus(x.st, D).text+(x.st.late ? ' (trễ lịch)' : '')+', '+fD(x.st.start)+(x.st.end && x.st.end !== x.st.start ? ' – '+fD(x.st.end) : '')+(x.st.who.length ? ', '+x.st.who.map(w => nameOf(D, w)).join(', ') : '')).join('\n');

  return html`<button type="button" class=${'sbx'+(sg.side === 'l' ? ' l' : '')+(done ? ' done' : '')} style=${'grid-row:'+(sg.lane+1)+';grid-column:'+(c0+2)+' / '+(c1+3)} title=${title} aria-label=${title.replace(/\n/g, ', ')} onClick=${() => openJob(sg.p.id, target)}>${sg.side === 'l' ? html`<span>${sg.lab}</span>${bar}` : html`${bar}${sg.inBar ? null : html`<span>${sg.lab}</span>`}`}</button>`;
}
function SubRow({pr, days, D, off, mode}){

/* Link Drive → {id, kind}; tên file/folder lấy qua /api/drive?meta=1, nhớ trong máy để không hỏi lại */
function driveRef(u){
  const s = String(u || ''), id = driveId(s);
  if(id) return {id, kind: 'file'};
  const m = s.match(/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]{10,})/);
  return m ? {id: m[1], kind: 'folder'} : null;
}
const FN = {};
function fetchLinkName(u){
  const r = driveRef(u); if(!r) return Promise.resolve('');
  const k = r.kind+':'+r.id;
  if(FN[k]) return FN[k];
  const cached = lsGet('mx.fn.'+k);
  if(cached) return (FN[k] = Promise.resolve(cached));
  FN[k] = fetch('/api/drive?meta=1&kind='+r.kind+'&id='+encodeURIComponent(r.id)).then(x => x.ok ? x.json() : {}).then(j => { const n = (j && j.name) || ''; if(n) lsSet('mx.fn.'+k, n); else delete FN[k]; return n; }, () => { delete FN[k]; return ''; });
  return FN[k];
}
const withTimeout = (pr, ms, dflt) => Promise.race([pr, new Promise(r => setTimeout(() => r(dflt), ms))]);
function useLinkName(u, stored){
  const [n, setN] = useState(stored || '');
  useEffect(() => { let on = true; setN(stored || ''); if(!stored && u) fetchLinkName(u).then(x => { if(on && x) setN(x); }); return () => { on = false; }; }, [u, stored]);
  return n;
}
function FileLink({url, name, big}){
  const ref = driveRef(url), nm = useLinkName(url, name);
  const isVid = /\.(mp4|mov|m4v|webm|mkv|avi)$/i.test(nm || url || '');
  const icon = ref && ref.kind === 'folder' ? 'folder' : isVid ? 'film' : ref ? 'file' : 'link';
  let host = ''; try { host = new URL(url).hostname.replace(/^www\./, ''); } catch(e){}
  const sub = ref ? (ref.kind === 'folder' ? 'Folder trên Google Drive' : 'File trên Google Drive') : host;
  return html`<a class=${'flink'+(big ? ' big' : '')} href=${url} target="_blank" rel="noopener" title=${url}>
    <span class="flink-ic" aria-hidden="true"><${Ic} n=${icon} s=${big ? 19 : 16}/></span>
    <span class="flink-t"><b>${nm || (ref ? (ref.kind === 'folder' ? 'Folder Google Drive' : 'File Google Drive') : shortUrl(url))}</b>${big ? html`<small>${sub}</small>` : null}</span>
  </a>`;
}
function LinkInput({value, onInput, onEnter, label, placeholder}){
  const ref = useRef(null);

  return html`<input ref=${ref} class="inp sm" type="url" placeholder=${placeholder} value=${value} aria-label=${label} onInput=${e => onInput(e.target.value)} onKeyDown=${e => { if(e.key === 'Enter') onEnter(); if(e.key === 'Escape') onEnter('cancel'); }}/>`;

function CapBar({m}){
  const segs = [['used', m.used, 'Đã dùng'], ['res', Math.max(0, m.reserved - m.used), 'Giữ chỗ chưa dùng'], ['unl', m.unlogged, 'Dùng chưa log'], ['free', Math.max(0, m.bookable), 'Còn book được']];
  const total = Math.max(m.cap, sum(segs.map(s => s[1]))) || 1;
  const shown = segs.filter(s => s[1] > 0);
  return html`<div class="capbar" role="img" aria-label=${segs.map(s => s[2]+' '+fN(s[1])).join(', ')}>
    ${shown.length ? shown.map(s => html`<i key=${s[0]} class=${'cb-'+s[0]} style=${'flex-grow:'+s[1]} title=${s[2]+': '+fN(s[1])}></i>`) : html`<i class="cb-empty"></i>`}
    ${total > m.cap && m.cap > 0 ? html`<span class="cap-tick" style=${'left:calc('+(m.cap / total * 100)+'% - 1px)'} title=${'Cap '+fN(m.cap)}></span>` : null}
  </div>`;
}

const nmWord = v => unaccent(v).trim().replace(/\s+/g, '-').replace(/[^A-Za-z0-9-]/g, '').replace(/-{2,}/g, '-').replace(/^-|-$/g, '');

/* Kiểm một tên file theo folder: lỗi chung (ký tự, chữ cấm), cấu trúc, model code, Job ID */
function nmCheck(name, f, job, models){
  const n = String(name || '').trim(); if(!n) return null;
  const st = NM_STAGES[f], errs = [], warns = [];
  if(f === '04B_Shoot') return {n, ok: true, errs, warns: ['04B_Shoot giữ nguyên tên file camera, không kiểm.']};
  if(/\s/.test(n)) errs.push('có khoảng trắng');
  if(/[^\x00-\x7F]/.test(n)) errs.push('có dấu tiếng Việt hoặc ký tự đặc biệt');
  const parts = n.split('.');
  if(parts.length < 2) errs.push('thiếu đuôi file');
  if(parts.length > 2) errs.push('có dấu chấm ngoài phần đuôi file');
  const stem = parts[0];
  if(/[^A-Za-z0-9_-]/.test(stem.replace(/[^\x00-\x7F]|\s/g, ''))) errs.push('chỉ được dùng chữ không dấu, số, _ và -');
  const toks = stem.toLowerCase().split(/[_-]/);
  const ban = toks.filter(t => NM_BAN.indexOf(t) >= 0);
  if(ban.length) errs.push('có chữ cấm: '+ban.join(', '));
  if(toks.indexOf('fix') >= 0 && !(f === '05_Gen' && /_FIX(_|\.)/.test(n))) errs.push('"fix" chỉ dùng làm hậu tố _FIX ở 05_Gen');
  if(!errs.length && st.re && !st.re.some(r => r.test(n))){
    errs.push('sai cấu trúc '+st.fmt);
    if(/(^|_)SH\d{1,2}(_|\.)|_[vtR]\d(_|\.)|(^|_)EP\d(_|\.)/.test(n) && !/_R\d+\./.test(n)) warns.push('Số cần đệm 0: SH010, v01, t01, EP03.');
    const other = FOLDERS.filter(k => k !== f && NM_STAGES[k] && NM_STAGES[k].re && NM_STAGES[k].re.some(r => r.test(n)));
    if(other.length) warns.push('Tên này khớp quy tắc của '+other.join(', ')+'. Kiểm tra lại folder.');
  }
  if(f === '05_Gen'){ const m = /_(KF|EF|VID|PLT)_([A-Z0-9]+)_v\d{2}/.exec(n); if(m && !models[m[2]]) errs.push('model code '+m[2]+' chưa có trong bảng'); }
  if(job && st.job && !errs.length && n.indexOf(job+'_') !== 0) warns.push('Job ID khác job đang chọn ('+job+').');

}
/* Dựng tên theo folder và các ô đang điền */
function nmBuild(f, v, job, rev, client){
  const J = job || 'YYMM_CODE_Project', st = NM_STAGES[f], ext = '.'+(v.ext && st.exts.indexOf(v.ext) >= 0 ? v.ext : st.ext);
  const deliv = v.deliv === '_' ? (nmWord(v.delivOther) || 'Deliverable') : v.deliv;
  const out = {names: [], side: [], dirs: [], warn: []};
  if(f === '01_Brief') out.names.push([yymmdd(v.date), nmWord(v.kind) || 'Brief', nmWord(v.src)].filter(Boolean).join('_')+ext);
  if(f === '02_Treatment') out.names.push(J+'_'+(nmWord(v.tkind) || 'Treatment')+'_'+nmV(v.ver)+ext);
  if(f === '03_Board'){
    if(v.anim) out.names.push(J+'_Animatic_'+nmV(v.ver)+(v.ext === 'mp4' || !v.ext ? '.mp4' : ext));
    else nmShots(v.shot, v.n).forEach(sh => out.names.push((v.ep ? 'EP'+pad(v.ep)+'_' : '')+sh+'_BRD_'+nmV(v.ver)+ext));
  }
  if(f === '04_Asset') out.names.push(v.atype+'_'+(nmWord(v.aname) || 'Ten')+'_'+(nmWord(v.angle) || 'Sheet')+'_'+nmV(v.ver)+ext);
  if(f === '04B_Shoot'){ for(let d = 1; d <= Math.max(1, Math.min(9, +v.days || 1)); d++) (v.cams || 'A').split('').forEach(c => out.dirs.push('04B_Shoot/DAY'+pad(d)+'/CAM-'+c+'/')); }
  if(f === '05_Gen'){
    const gext = v.ext && st.exts.indexOf(v.ext) >= 0 ? '.'+v.ext : (v.gk === 'VID' ? '.mp4' : '.png');
    const suf = v.suf.map(x => '_'+x).join('');
    nmShots(v.shot, v.n).forEach(sh => {
      const base = (v.ep ? 'EP'+pad(v.ep)+'_' : '')+sh+'_'+v.gk+'_'+v.model+'_'+nmV(v.ver);
      for(let t = 1; t <= Math.max(1, Math.min(20, +v.takes || 1)); t++) out.names.push(base+'_t'+pad(t)+suf+gext);
      out.side.push(base+'.txt');
      out.dirs.push('05_Gen/'+sh+'/');
    });
  }
  if(f === '06_Comp') nmShots(v.shot, v.n).forEach(sh => out.names.push((v.ep ? 'EP'+pad(v.ep)+'_' : '')+sh+'_COMP_'+nmV(v.ver)+ext));
  if(f === '07_Edit') out.names.push(J+'_'+deliv+'_EDIT_'+nmV(v.ver)+ext);
  if(f === '08_QC'){
    out.names.push(J+'_'+deliv+'_R'+Math.max(1, +v.r || 1)+ext);
    if(rev !== null && rev !== undefined && v.r > rev) out.warn.push('HĐ có '+rev+' vòng sửa. R'+v.r+' vượt số vòng đã ký, là căn cứ tính phí thêm.');
  }
  if(f === '09_Finish') out.names.push(J+'_'+deliv+'_MASTER_'+nmV(v.ver)+ext);
  if(f === '10_Giao'){
    const dur = (String(v.dur).replace(/\D/g, '') || '30')+'s';
    (v.ratios.length ? v.ratios : ['16x9']).forEach(r => (v.langs.length ? v.langs : ['VN']).forEach(l => out.names.push(J+'_'+deliv+'_'+dur+'_'+r+'_'+l+(v.redo > 1 ? '_'+nmV(v.redo) : '')+ext)));
  }

  return out;
}

/* ---------- settings ---------- */
const BK_COLS = ['staff', 'accounts', 'projects', 'config', 'members'];
function backupDocs(){
  const docs = [];
  ['staff', 'accounts', 'projects', 'members'].forEach(c => Object.keys(S[c] || {}).forEach(id => docs.push([c+'/'+id, S[c][id]])));
  if(S.config) docs.push(['config/main', S.config]);
  return docs;
}
function downloadBackup(){
  const blob = new Blob([JSON.stringify({app: 'magentx-board', version: 1, at: new Date().toISOString(), docs: backupDocs()})], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'MagentX_backup_'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  logPut([{t: 'admin', text: 'tải bản backup dữ liệu'}]);
}
function parseBackup(text){
  const j = JSON.parse(text);
  const list = Array.isArray(j) ? j : (j && Array.isArray(j.docs) ? j.docs : null);
  if(!list) throw new Error('format');
  return list.filter(e => Array.isArray(e) && typeof e[0] === 'string' && e[1] && typeof e[1] === 'object' && !Array.isArray(e[1])).filter(e => { const s = e[0].split('/'); return s.length === 2 && s[1] && BK_COLS.indexOf(s[0]) >= 0; });
}
function BackupPanel({D}){
  const [pending, setPending] = useState(null);
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);
  const onFile = e => {
    const file = e.target.files && e.target.files[0]; e.target.value = ''; if(!file) return;
    file.text().then(t => {
      const docs = parseBackup(t);
      if(!docs.length){ toast('File không có dữ liệu của bảng.', 'warn'); return; }
      const n = c => docs.filter(d => d[0].indexOf(c+'/') === 0).length;
      setPending({name: file.name, docs, summary: n('projects')+' dự án, '+n('staff')+' nhân sự, '+n('accounts')+' account'});
    }).catch(() => toast('Không đọc được file. Cần file .json xuất từ bảng này.', 'bad'));
  };
  const run = () => {
    if(!pending || busy) return; setBusy(true);
    Promise.all(pending.docs.map(d => wdoc(d[0], r => r.set(d[1])))).then(res => {
      const ok = res.filter(Boolean).length; setBusy(false); setPending(null);
      if(ok) logPut([{t: 'admin', text: 'nhập dữ liệu từ file '+pending.name+' ('+ok+' mục)'}]);
      toast(ok === res.length ? 'Đã nhập '+ok+' mục dữ liệu.' : 'Đã nhập '+ok+'/'+res.length+' mục, một số mục bị lỗi.', ok === res.length ? '' : 'warn');
    });
  };
  return html`<section class="panel"><h2>Sao lưu và nhập dữ liệu</h2>
    <div class="acts"><button type="button" class="btn sm" onClick=${downloadBackup}><${Ic} n="download" s=${16}/>Tải bản backup (.json)</button>${canW() ? html`<button type="button" class="btn sm" onClick=${() => fileRef.current && fileRef.current.click()}><${Ic} n="upload" s=${16}/>Nhập từ file backup</button>` : null}<input ref=${fileRef} type="file" accept=".json,application/json" style="display:none" onChange=${onFile}/></div>
    ${pending ? html`<div class="tool-strip"><span>File <b>${pending.name}</b>: ${pending.summary}. Mục trùng mã sẽ bị ghi đè.</span><span class="sp"></span><button type="button" class="btn sm primary" disabled=${busy} onClick=${run}><${Ic} n="check" s=${16}/>${busy ? 'Đang nhập…' : 'Nhập '+pending.docs.length+' mục'}</button><button type="button" class="btn sm" disabled=${busy} onClick=${() => setPending(null)}>Thôi</button></div>` : null}
    <p class="meta">Bản backup chứa toàn bộ dự án, nhân sự, account và thông số. Dùng file này để chuyển dữ liệu từ bản demo sang, hoặc khôi phục khi cần.</p>
  </section>`;
}

/* ---------- video review player ---------- */
const RV_COLORS = ['#ff4d4f', '#ffd43b', '#4dabf7', '#ffffff'];
const RV_COLOR_NAMES = ['Đỏ', 'Vàng', 'Xanh', 'Trắng'];
const RV_FPS = [24, 25, 30, 50, 60];
const VIDEO_STEPS = {s05: 1, s06: 1, s07: 1, s08: 1, s09: 1, s10: 1};
function driveId(u){
  const s = String(u || '');
  const m = s.match(/(?:drive|docs)\.google\.com\/file\/d\/([\w-]{20,})/) || s.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]{20,})/) || s.match(/drive\.usercontent\.google\.com\/download\?(?:[^#]*&)?id=([\w-]{20,})/);
  return m ? m[1] : '';
}
function reviewSrc(u){
  const id = driveId(u);
  if(id) return '/api/drive?id='+id;
  return /^https?:\/\/[^?#]+\.(mp4|webm|m4v|mov)(\?|#|$)/i.test(String(u || '')) ? String(u) : '';
}
function canReview(u){ return safeUrl(u) && !!reviewSrc(u); }
/* Link để mở player: link kết quả nếu là file video, không thì link video nộp kèm cho đúng bản đang duyệt. */
function videoLinkOf(st){
  if(canReview(st.link)) return st.link;
  return st.rv && (+st.rv.ver || 0) === st.ver && canReview(st.rv.url) ? st.rv.url : '';
}
function tcOf(t, fps){
  const f = Math.max(0, Math.floor((+t || 0) * fps + 1e-3)), s = Math.floor(f / fps);
  const hh = Math.floor(s / 3600);
  return (hh ? pad(hh)+':' : '')+pad(Math.floor(s % 3600 / 60))+':'+pad(s % 60)+':'+pad(f % fps);
}
function parseTc(v){
  const s = String(v || '').trim().replace(',', '.');
  if(!s || !/^\d+(\.\d+)?(:\d+(\.\d+)?){0,2}$/.test(s)) return null;
  return s.split(':').reduce((a, x) => a * 60 + (+x), 0);
}
const rv36 = n => { const s = Math.max(0, Math.min(1295, Math.round(n * 1295))).toString(36); return s.length < 2 ? '0'+s : s; };
function encStroke(st){ return st.c+'|'+st.p.map(q => rv36(q[0])+rv36(q[1])).join(''); }
function decStroke(s){
  const i = String(s).indexOf('|'), d = String(s).slice(i + 1), p = [];
  for(let k = 0; k + 4 <= d.length; k += 4) p.push([parseInt(d.slice(k, k + 2), 36) / 1295, parseInt(d.slice(k + 2, k + 4), 36) / 1295]);
  return {c: +String(s).slice(0, i) || 0, p};
}
function paintStrokes(cv, strokes){
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const lw = Math.max(2.5, W * 0.0045);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  strokes.forEach(st => {
    if(!st.p.length) return;
    ctx.beginPath();
    st.p.forEach((q, i) => i ? ctx.lineTo(q[0] * W, q[1] * H) : ctx.moveTo(q[0] * W, q[1] * H));
    if(st.p.length === 1) ctx.lineTo(st.p[0][0] * W + 0.5, st.p[0][1] * H);
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = lw + 3; ctx.stroke();
    ctx.strokeStyle = RV_COLORS[st.c] || RV_COLORS[0]; ctx.lineWidth = lw; ctx.stroke();
  });
}
function VideoLinkAdd({p, st, has}){
  const [open, setOpen] = useState(false);
  const [v, setV] = useState('');
  const save = () => {
    const u = v.trim(); if(!u) return;

/* ---------- nhật ký thao tác (chỉ Hào) ---------- */
/* Trước LOG_SINCE chưa có nhật ký: lấy lại nộp bản, duyệt, góp ý, gate từ dữ liệu dự án.
   Thao tác của khách (qua link duyệt) luôn lấy từ dữ liệu dự án. */
function logDerived(D, from){
  const ev = [], inR = t => !!t && t >= from, pre = t => inR(t) && t < LOG_SINCE;
  const push = (o, p, sid) => ev.push(Object.assign({id: 'd'+ev.length, pid: p.id, pn: p.name, sid, src: o.by === 'client' ? 'client' : 'data'}, o));
  D.projects.forEach(p => {
    if(!p.source && pre(p.createdAt)) push({at: p.createdAt, by: p.createdBy, t: 'project', x: 'tạo dự án'}, p);
    p.steps.forEach(st => {
      const nm = st.def.no+' '+st.def.name;
      Object.keys(st.hist || {}).forEach(k => { const h = st.hist[k]; if(h && pre(h.at)) push({at: h.at, by: h.by, t: 'submit', x: 'nộp '+nm+' '+k.toUpperCase()}, p, st.id); });
      if(st.subAt && pre(st.subAt) && !(st.hist || {})['v'+st.ver]) push({at: st.subAt, by: st.subBy, t: 'submit', x: 'nộp '+nm+' '+vTag(st.ver)}, p, st.id);
      Object.keys(st.qc || {}).forEach(r => { const q = st.qc[r]; if(q && q.ok && pre(q.at)) push({at: q.at, by: r, t: 'qc', x: 'duyệt '+nm+' '+vTag(q.ver)}, p, st.id); });
      st.comments.forEach(c => { if(pre(c.at)) push({at: c.at, by: c.by, t: c.kind === 'fix' ? 'qc' : 'cm', x: (c.kind === 'fix' ? 'yêu cầu sửa ' : 'góp ý ')+nm+(c.ver ? ' '+vTag(c.ver) : '')+': '+logQ(c.text)}, p, st.id); });
      st.vnotes.forEach(n => {
        const x = 'ghi chú video '+nm+' tại '+logMs(n.t)+(n.text ? ': '+logQ(n.text) : '')+(n.d && n.d.length ? ' (có vẽ)' : '');
        if(n.src === 'client'){ if(inR(n.at)) push({at: n.at, by: 'client', cn: n.cn || '', t: 'client', x}, p, st.id); }
        else if(pre(n.at)) push({at: n.at, by: n.by, t: 'cm', x}, p, st.id);
      });
    });
    p.gates.forEach(g => { if(g.ok && pre(g.at)) push({at: g.at, by: g.by, t: 'project', x: 'xác nhận '+g.label}, p); });
    (p.shareList || []).forEach(s => { const d = s.dec; if(d && inR(d.at)) push({at: d.at, by: 'client', cn: d.name || '', t: 'client', x: (d.ok ? 'đồng ý ' : 'yêu cầu sửa ')+logStep(s.sid)+' '+vTag(d.ver)+(d.text ? ': '+logQ(d.text) : '')}, p, s.sid); });
  });
  return ev.filter(e => e.by);
}
const LOG_RANGES = [['1', 'Hôm nay'], ['7', '7 ngày'], ['30', '30 ngày']];
const logFold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
const logHm = ms => { const d = new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); };
function LogView({D, me}){
  const ok = me === 'hao';
  const [range, setRange] = useState('7');
  const [who, setWho] = useState('');
  const [cat, setCat] = useState('');
  const [q, setQ] = useState('');
  const [lim, setLim] = useState(200);
  const [docs, setDocs] = useState({});
  const dayIds = useMemo(() => { const t = today(), a = []; for(let i = 0; i < +range; i++) a.push(addDays(t, -i)); return a; }, [range, D.t]);
  useEffect(() => {
    if(!ok || !S.db) return;
    const offs = dayIds.map(d => { try {
      return S.db.doc('config/log-'+d).onSnapshot(sn => {
        const data = sn.exists ? (sn.data() || {}) : {}, e = data.e || {};
        setDocs(o => Object.assign({}, o, {[d]: Object.keys(e).map(k => Object.assign({id: k}, e[k]))}));
      }, () => setDocs(o => Object.assign({}, o, {[d]: o[d] || []})));
    } catch(err){ return null; } });
    return () => offs.forEach(f => { if(typeof f === 'function') f(); });
  }, [ok, dayIds.join()]);
  useEffect(() => { setLim(200); }, [range, who, cat, q]);
  if(!ok) return html`<div class="ph"><div><h1>Nhật ký thao tác</h1><p>Chỉ tài khoản Hào xem được trang này.</p></div></div>`;

  const from = parse(dayIds[dayIds.length - 1]).getTime();
  const all = [];
  dayIds.forEach(d => (docs[d] || []).forEach(x => { if(x && x.at && x.by && x.at >= from) all.push(x); }));
  logDerived(D, from).forEach(x => all.push(x));
  all.sort((a, b) => b.at - a.at);
  const loading = dayIds.some(d => !docs[d]);
  const whoName = x => x.by === 'client' ? 'Khách'+(x.cn ? ' '+x.cn : '') : nameOf(D, x.by);
  const pname = x => (x.pid && D.pmap[x.pid] && D.pmap[x.pid].name) || x.pn || '';

  const stat = {};
  all.forEach(x => { const k = x.by === 'client' ? 'client' : x.by; const r = stat[k] || (stat[k] = {n: 0, last: 0}); r.n++; if(x.at > r.last) r.last = x.at; });
  const people = D.staffList.filter(s => s.active !== false || stat[s.id]).concat(D.reqList.filter(s => stat[s.id])).map(s => ({id: s.id, name: s.name}))
    .concat(Object.keys(stat).filter(k => k !== 'client' && !D.staffMap[k]).map(k => ({id: k, name: nameOf(D, k)})))
    .concat(stat.client ? [{id: 'client', name: 'Khách'}] : []);
  const qq = logFold(q.trim());
  const list = all.filter(x => (!who || (who === 'client' ? x.by === 'client' : x.by === who)) && (!cat || x.t === cat)
    && (!qq || logFold(x.x+' '+pname(x)+' '+whoName(x)).indexOf(qq) >= 0));
  const perDay = {}; list.forEach(x => { const d = ymd(new Date(x.at)); perDay[d] = (perDay[d] || 0) + 1; });
  const groups = [];
  list.slice(0, lim).forEach(x => { const d = ymd(new Date(x.at)), g = groups[groups.length - 1]; if(g && g.d === d) g.items.push(x); else groups.push({d, items: [x]}); });
  const t = today();

  const csv = () => {
    const rows = [['Thời gian', 'Người', 'Đăng nhập hộ', 'Loại', 'Thao tác', 'Dự án', 'Nguồn']].concat(list.map(x => {
      const d = new Date(x.at);
      return [ymd(d)+' '+logHm(x.at)+':'+pad(d.getSeconds()), whoName(x), x.via && x.via !== x.by ? nameOf(D, x.via) : '', LOG_CAT[x.t] || '', x.x, pname(x), x.src === 'client' ? 'Link khách' : x.src === 'data' ? 'Dữ liệu dự án' : 'Nhật ký'];
    }));
    const s = '﻿'+rows.map(r => r.map(c => '"'+String(c === null || c === undefined ? '' : c).replace(/"/g, '""')+'"').join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([s], {type: 'text/csv;charset=utf-8'})); a.download = 'MagentX_nhat-ky_'+t+'.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const pick = id => setWho(who === id ? '' : id);

  return html`
    <div class="ph"><div><h1>Nhật ký thao tác</h1><p>Ai làm gì trên bảng, theo thời gian: nộp bản, duyệt, góp ý, credit, link khách, cài đặt và đăng nhập. Chỉ tài khoản Hào thấy trang này.</p></div>
      <div class="seg" role="group" aria-label="Khoảng thời gian">${LOG_RANGES.map(r => html`<button key=${r[0]} type="button" class=${range === r[0] ? 'on' : ''} aria-pressed=${range === r[0]} onClick=${() => setRange(r[0])}>${r[1]}</button>`)}</div></div>
    <div class="lg-people" role="group" aria-label="Lọc theo người">
      <button type="button" class="lg-p" aria-pressed=${!who} onClick=${() => setWho('')}><b>Cả phòng</b><span class="lg-n">${all.length}</span><span class="meta">thao tác</span></button>
      ${people.map(pp => { const st = stat[pp.id]; return html`<button key=${pp.id} type="button" class=${'lg-p'+(st ? '' : ' zero')} aria-pressed=${who === pp.id} onClick=${() => pick(pp.id)}><b>${pp.name}</b><span class="lg-n">${st ? st.n : 0}</span><span class="meta">${st ? 'lần cuối '+(ymd(new Date(st.last)) === t ? logHm(st.last) : fT(st.last)) : 'chưa có thao tác'}</span></button>`; })}
    </div>
    <section class="panel flush lg-panel" aria-label="Danh sách thao tác">
      <div class="panel-h lg-bar">
        <select class="sel sm auto" value=${cat} aria-label="Loại thao tác" onChange=${e => setCat(e.target.value)}><option value="">Mọi loại thao tác</option>${Object.keys(LOG_CAT).map(k => html`<option key=${k} value=${k}>${LOG_CAT[k]}</option>`)}</select>
        <input class="inp sm lg-q" type="search" placeholder="Tìm theo dự án, bước, nội dung" aria-label="Tìm trong nhật ký" value=${q} onInput=${e => setQ(e.target.value)}/>
        <span class="sp"></span>
        <span class="meta">${list.length} thao tác${loading ? ', đang tải…' : ''}</span>
        <button type="button" class="btn sm" disabled=${!list.length} onClick=${csv}><${Ic} n="download" s=${16}/>Tải CSV</button>
      </div>
      ${groups.length ? groups.map(g => html`<div key=${g.d} class="lg-g">
          <div class="lg-day"><h3>${WD_LONG[parse(g.d).getDay()]}, ${fD(g.d)}</h3>${g.d === t ? html`<span class="lg-tag">Hôm nay</span>` : g.d === addDays(t, -1) ? html`<span class="lg-tag">Hôm qua</span>` : null}<span class="badge-n">${perDay[g.d]}</span></div>
          <ol class="lg-list">${g.items.map(x => { const pn = pname(x); return html`<li key=${x.id} class=${'lg-row'+(x.src === 'data' ? ' old' : '')}>
            <time class="lg-t" datetime=${new Date(x.at).toISOString()} title=${fT(x.at)}>${logHm(x.at)}</time>
            <span class="lg-who"><b>${whoName(x)}</b>${x.via && x.via !== x.by ? html`<span class="lg-via" title=${'Đăng nhập bằng mã PIN của '+nameOf(D, x.via)}>${nameOf(D, x.via)} đăng nhập hộ</span>` : null}</span>
            <span class="lg-x"><span>${x.x}</span>${pn ? (D.pmap[x.pid] ? html`<a class="lg-pn" href=${'#job-'+x.pid} onClick=${e => { e.preventDefault(); openJob(x.pid, x.sid || null); }}>${pn}</a>` : html`<span class="lg-pn">${pn} (đã xóa)</span>`) : null}${x.src === 'data' ? html`<span class="lg-src">Lấy lại từ dữ liệu dự án</span>` : null}</span>
            <span class=${'lg-cat '+x.t}>${LOG_CAT[x.t] || 'Khác'}</span>
          </li>`; })}</ol>
        </div>`)
        : html`<div class="lg-empty"><p class="empty">${loading ? 'Đang tải nhật ký…' : all.length ? 'Không có thao tác nào khớp bộ lọc.' : 'Chưa có thao tác nào trong khoảng này.'}</p></div>`}
      ${list.length > lim ? html`<div class="lg-more"><button type="button" class="btn sm" onClick=${() => setLim(lim + 200)}>Xem thêm ${Math.min(200, list.length - lim)} thao tác</button><span class="meta">Đang hiện ${lim}/${list.length}</span></div>` : null}
    </section>
    ${from < LOG_SINCE ? html`<p class="meta lg-note">Nhật ký bắt đầu ghi từ ${fT(LOG_SINCE)}. Trước đó chỉ có nộp bản, duyệt, góp ý và gate, lấy lại từ dữ liệu dự án. Thao tác của khách qua link duyệt luôn lấy từ dữ liệu dự án.</p>` : null}`;
}
