<style>

  --action:#7c9dff;--action-hover:#98b2ff;--action-soft:#1f2b4d;--on-action:#0f1219;--ok:#5ccf8a;--ok-soft:#173523;--wait:#f0bd5a;--wait-soft:#3a2d10;--bad:#ff7d73;--bad-soft:#40201e;color-scheme:dark}}

.sp{flex:1}
.meta{color:var(--ink-2);font-size:14px}

.btn.sm{height:36px;padding:0 13px;font-size:14px;border-radius:9px}
.btn.xs{height:30px;padding:0 10px;font-size:13.5px;border-radius:8px;border-width:1px}

.btn.primary:hover{background:var(--action-hover);border-color:var(--action-hover)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}

.boot-card b{font-size:19px}

.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--rule)}
.brand{font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-weight:500;color:var(--ink-2)}
.ttl{display:flex;flex-direction:column;min-width:0}
.ttl b{font-size:16.5px;line-height:1.3;display:flex;align-items:center;gap:8px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.left{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0;background:#0b0d12;color:#eceff6;
  --surface:#171b25;--tint:#232a3b;--ink:#eceff6;--ink-2:#aeb5c7;--ink-3:#808899;--rule:#2a3142;--field:#4c5672;--field-hover:#6a7594;--action:#7c9dff;--action-hover:#98b2ff;--action-soft:#1f2b4d;--on-action:#0f1219;color-scheme:dark}

.tl::before{content:"";position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--tint)}
.tl .buf{position:absolute;left:0;top:12px;height:4px;border-radius:2px;background:#4c5672}
.tl .fill{position:absolute;left:0;top:12px;height:4px;border-radius:2px;background:var(--action)}

  .main{display:block}
  .stage{height:46vh;min-height:240px}

  .compose{flex-wrap:wrap}.compose .btn{flex:1 1 100%}
  .ttl .meta{display:none}
  .top{padding:10px 12px}

  const draftHere = draft.length > 0 && (mode !== 'video' || draftT === null || Math.abs(cur - draftT) <= frame * 0.6);
  const shown = draftHere ? draft : (!draft.length && act ? act.d.map(decStroke) : []);
  useEffect(() => { const cv = cref.current; if(!cv || !box) return; const dpr = Math.min(2, window.devicePixelRatio || 1), W = Math.round(box.w * dpr), H = Math.round(box.h * dpr); if(cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; } paint(cv, shown); });

  const dur = meta ? meta.dur : 0;
  const seek = (t, keep) => { const v = vref.current; const x = Math.max(0, Math.min(dur || 0, t)); if(v) v.currentTime = x; setCur(x); if(!keep) setSel(''); };
  const toggle = () => { const v = vref.current; if(!v) return; if(v.paused){ setSel(''); v.play().catch(() => {}); } else v.pause(); };
  const stepF = k => { const v = vref.current; if(!v || !meta) return; v.pause(); seek((Math.round(v.currentTime * fps) + k) / fps + 0.001); };
  const jump = n => { const v = vref.current; if(v && mode === 'video'){ v.pause(); seek(n.t + 0.0005, true); } setSel(n.nid); };
  const anchor = draft.length && draftT !== null ? draftT : cur;
  const needName = () => { if(name.trim()) return false; toast('Nhập tên của bạn trước, để MagentX biết ai góp ý.', 'bad'); const el = document.getElementById('cname'); if(el) el.focus(); return true; };
  const send = async () => {
    const body = text.trim(); if(!body && !draft.length) return;
    if(needName()) return;
    let t = anchor;
    if(mode !== 'video'){ const s = manual.trim().replace(',', '.'); if(!/^\d+(\.\d+)?(:\d+(\.\d+)?){0,2}$/.test(s)){ toast('Nhập thời điểm dạng phút:giây, ví dụ 0:12.', 'bad'); return; } t = s.split(':').reduce((a, x) => a * 60 + (+x), 0); }
    setBusy(true);
    try {
      const d = await api({a: 'note', time: t, text: body, name: name.trim(), d: draft.filter(s => s.p.length).map(encStroke)});
      setData(d); setText(''); setManual(''); setDraft([]); setDraftT(null); setTool(false);
      const mine = d.notes.filter(n => n.mine).sort((a, b) => b.at - a.at)[0]; if(mine) setSel(mine.nid);
      toast('Đã gửi ghi chú tại '+tc(t));
    } catch(e){ toast(e.message, 'bad'); }
    setBusy(false);
  };
  const del = async n => { try { setData(await api({a: 'del', nid: n.nid})); if(sel === n.nid) setSel(''); toast('Đã xóa ghi chú'); } catch(e){ toast(e.message, 'bad'); } };
  const decide = async ok => {
    if(needName()) return;
    if(!ok && !decText.trim()){ toast('Ghi rõ cần sửa gì.', 'bad'); return; }
    setBusy(true);
    try { const d = await api({a: 'dec', ok, name: name.trim(), text: ok ? '' : decText.trim()}); setData(d); setDecMode(''); setDecText(''); toast(ok ? 'Đã gửi: đồng ý V'+ver : 'Đã gửi yêu cầu sửa'); } catch(e){ toast(e.message, 'bad'); }
    setBusy(false);
  };

  const pt = e => { const r = cref.current.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
  const dDown = e => { if(!tool || draft.length >= 24) return; e.preventDefault(); try { cref.current.setPointerCapture(e.pointerId); } catch(x){} const v = vref.current; if(v && !v.paused) v.pause(); if(!draft.length) setDraftT(v && mode === 'video' ? v.currentTime : null); drawing.current = {c: color, p: [pt(e)]}; setSel(''); setDraft(d => d.concat([drawing.current])); };
  const dMove = e => { const s = drawing.current; if(!s) return; const q = pt(e), l = s.p[s.p.length - 1]; if(s.p.length >= 400 || Math.hypot(q[0] - l[0], q[1] - l[1]) < 0.004) return; s.p.push(q); paint(cref.current, draft); };
  const dUp = () => { if(drawing.current){ drawing.current = null; setDraft(d => d.slice()); } };
  const toolOn = on => { const v = vref.current; if(on && v && !v.paused) v.pause(); setTool(on); };
  const tlAt = e => { const r = tlRef.current.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * dur; };
  const tDown = e => { const v = vref.current; if(!v || !meta) return; e.preventDefault(); try { tlRef.current.setPointerCapture(e.pointerId); } catch(x){} scrub.current = {was: !v.paused}; v.pause(); seek(tlAt(e)); };
  const tMove = e => { if(scrub.current) seek(tlAt(e)); };
  const tUp = () => { const s = scrub.current; scrub.current = null; if(s && s.was && vref.current) vref.current.play().catch(() => {}); };
  const keyRef = useRef(null);
  keyRef.current = e => {
    const tag = (e.target && e.target.tagName) || '', typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if(e.key === 'Escape'){ if(typing) e.target.blur(); else if(tool) setTool(false); return; }
    if(typing || e.ctrlKey || e.metaKey || e.altKey || mode !== 'video') return;
    if(e.key === ' ' || e.key === 'k' || e.key === 'K'){ e.preventDefault(); toggle(); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); e.shiftKey ? seek(cur - 1) : stepF(-1); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); e.shiftKey ? seek(cur + 1) : stepF(1); }
    else if(e.key === 'd' || e.key === 'D'){ e.preventDefault(); toolOn(!tool); }
    else if(e.key === 'n' || e.key === 'N'){ if(taRef.current){ e.preventDefault(); taRef.current.focus(); } }
  };
  useEffect(() => { const k = e => keyRef.current(e); document.addEventListener('keydown', k, true); return () => document.removeEventListener('keydown', k, true); }, []);

  const onMeta = e => {
    const v = e.target; setMeta({dur: v.duration || 0, w: v.videoWidth, h: v.videoHeight});
    const r = restore.current; restore.current = null;
    if(r){ v.currentTime = r.t; v.playbackRate = rate; if(r.play) v.play().catch(() => {}); }
  };
  const onErr = () => {
    const v = vref.current;
    if(!meta){ if(!blobUrl) setFailed(true); return; }
    /* mất kết nối giữa chừng: tự nối lại tại đúng chỗ đang xem */
    if(retries.current < 4 && v){ retries.current++; restore.current = {t: v.currentTime || cur, play: !v.paused}; const s = v.src; v.removeAttribute('src'); v.load(); setTimeout(() => { v.src = s; v.load(); }, 600 * retries.current); }
    else toast('Mạng đang chập chờn. Tải lại trang nếu video không chạy tiếp.', 'bad');
  };
  const onProg = e => { const v = e.target; try { const b = v.buffered; let end = 0; for(let i = 0; i < b.length; i++) if(b.start(i) <= v.currentTime + 0.5) end = Math.max(end, b.end(i)); setBuffered(end); } catch(x){} };
  const pct = t => (dur ? Math.max(0, Math.min(100, t / dur * 100)) : 0)+'%';
  const loadText = load.s === 'done' ? 'Video đã tải xong, tua tức thì.'
    : load.s === 'loading' && load.total ? 'Đang tải sẵn video '+Math.floor(load.p / load.total * 100)+'% ('+RV.mb(load.p)+' / '+RV.mb(load.total)+'). Tua sẽ mượt hơn khi tải xong.'
    : load.s === 'big' ? 'File lớn ('+RV.mb(load.total)+'), video phát trực tiếp.' : load.s === 'stream' ? 'Đang phát trực tiếp.' : '';
  const mineDec = data.dec;
  return html`<div class="app">
    <header class="top">
      <div class="brand">MagentX <span>duyệt video</span></div>
      <div class="ttl"><b>${data.step.no} ${data.step.name} <span class="vchip">V${ver}</span></b><span class="meta">${data.project}</span></div>
      <span class="sp"></span>
    </header>
    <div class="main">
      <div class="left">
        <div class="stage" ref=${stageRef}>
          ${mode === 'none' ? html`<p class="msg">Không phát được video này. Liên hệ MagentX để nhận link khác.</p>` : html`<div class="fit" style=${box ? 'width:'+box.w+'px;height:'+box.h+'px' : 'width:100%;height:100%'}>
            ${mode === 'video'
              ? html`<video ref=${vref} src=${src} playsinline preload="auto" muted=${muted} onLoadedMetadata=${onMeta} onPlay=${() => setPlaying(true)} onPause=${e => { setPlaying(false); setCur(e.target.currentTime); }} onEnded=${() => setPlaying(false)}
                  onTimeUpdate=${e => { if(!playing) setCur(e.target.currentTime); }} onSeeked=${e => { setCur(e.target.currentTime); setWaiting(false); }} onWaiting=${() => setWaiting(true)} onPlaying=${() => { setWaiting(false); retries.current = 0; }} onCanPlay=${() => setWaiting(false)} onProgress=${onProg} onError=${onErr} onClick=${() => { if(!tool) toggle(); }}></video>`
              : html`<iframe src=${'https://drive.google.com/file/d/'+id+'/preview'} allow="autoplay; fullscreen" title="Video"></iframe>`}
            <canvas ref=${cref} class=${tool ? 'on' : ''} onPointerDown=${dDown} onPointerMove=${dMove} onPointerUp=${dUp} onPointerCancel=${dUp}></canvas>
            ${mode === 'video' && (!meta || waiting) ? html`<div class="msg"><div class="spin" aria-label="Đang tải"></div></div>` : null}
          </div>`}
        </div>
        <div class="ctl">
          ${mode === 'video' ? html`
            <div class="tl" ref=${tlRef} role="slider" tabindex="0" aria-label="Thanh thời gian" aria-valuemin="0" aria-valuemax=${Math.round(dur)} aria-valuenow=${Math.round(cur)} aria-valuetext=${tc(cur)} onPointerDown=${tDown} onPointerMove=${tMove} onPointerUp=${tUp} onPointerCancel=${tUp}>
              <i class="buf" style=${'width:'+(load.s === 'done' ? '100%' : pct(buffered))}></i><i class="fill" style=${'width:'+pct(cur)}></i>
              ${notes.map(n => html`<b key=${n.nid} class=${(n.ok ? 'ok' : '')+(act && act.nid === n.nid ? ' sel' : '')} style=${'left:'+pct(n.t)}></b>`)}
              <i class="head" style=${'left:'+pct(cur)}></i>
            </div>
            <div class="bar">
              <button type="button" class="btn sm primary" style="min-width:96px" disabled=${!meta} onClick=${toggle}><${Ic} n=${playing ? 'pause' : 'play'} s=${17}/>${playing ? 'Dừng' : 'Phát'}</button>
              <button type="button" class="icon-btn" disabled=${!meta} onClick=${() => stepF(-1)} title="Lùi 1 khung hình (phím ←)" aria-label="Lùi 1 khung hình"><${Ic} n="left" s=${16}/></button>
              <button type="button" class="icon-btn" disabled=${!meta} onClick=${() => stepF(1)} title="Tới 1 khung hình (phím →)" aria-label="Tới 1 khung hình"><${Ic} n="right" s=${16}/></button>
              <span class="tc"><b>${tc(cur)}</b> / ${tc(dur)}</span>
              <span class="sp"></span>
              <select class="sel auto" value=${rate} aria-label="Tốc độ phát" onChange=${e => { const r = +e.target.value; setRate(r); if(vref.current) vref.current.playbackRate = r; }}>${[0.25, 0.5, 1, 1.5, 2].map(r => html`<option key=${r} value=${r}>${r}×</option>`)}</select>
              <select class="sel auto" value=${fps} aria-label="Số khung hình mỗi giây" onChange=${e => { const f = +e.target.value; setFps(f); ls.set('mx.fps', String(f)); }}>${FPS.map(f => html`<option key=${f} value=${f}>${f} fps</option>`)}</select>
              <button type="button" class="icon-btn" onClick=${() => setMuted(!muted)} aria-label=${muted ? 'Bật tiếng' : 'Tắt tiếng'} title=${muted ? 'Bật tiếng' : 'Tắt tiếng'}><${Ic} n=${muted ? 'mute' : 'vol'} s=${16}/></button>
            </div>
            ${loadText ? html`<div class="load" aria-live="polite">${loadText}</div>` : null}`
          : mode === 'frame' ? html`<p class="load">Video đang mở bằng trình xem của Google Drive nên không tua theo khung hình được. Ghi thời điểm dạng phút:giây khi góp ý.</p>` : null}
          ${mode !== 'none' ? html`
            <div class="bar">
              <button type="button" class=${'btn sm'+(tool ? ' on' : '')} aria-pressed=${tool} onClick=${() => toolOn(!tool)}><${Ic} n="edit" s=${16}/>${tool ? 'Đang vẽ' : 'Vẽ lên khung hình'}</button>
              ${tool || draft.length ? html`<div class="colors" role="radiogroup" aria-label="Màu nét vẽ">${COLORS.map((c, i) => html`<button key=${c} type="button" role="radio" aria-checked=${color === i} aria-label=${CNAMES[i]} class=${color === i ? 'on' : ''} style=${'--c:'+c} onClick=${() => setColor(i)}></button>`)}</div>
                <button type="button" class="btn xs" disabled=${!draft.length} onClick=${() => setDraft(d => d.slice(0, -1))}><${Ic} n="undo" s=${14}/>Hoàn tác</button>
                <button type="button" class="btn xs" disabled=${!draft.length} onClick=${() => { setDraft([]); setDraftT(null); }}>Xóa nét vẽ</button>` : null}
            </div>
            <div class="compose">
              ${mode !== 'video' ? html`<input class="inp" style="width:104px;height:auto;flex:none" value=${manual} placeholder="phút:giây" aria-label="Thời điểm" onInput=${e => setManual(e.target.value)}/>` : null}
              <textarea ref=${taRef} class="inp" rows="2" value=${text} aria-label="Nội dung góp ý" placeholder=${mode === 'video' ? 'Góp ý tại '+tc(anchor)+': chỗ nào cần sửa…' : 'Chỗ nào cần sửa…'} onFocus=${() => { const v = vref.current; if(v && !v.paused) v.pause(); }} onInput=${e => setText(e.target.value)} onKeyDown=${e => { if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); send(); } }}></textarea>
              <button type="button" class="btn primary" disabled=${busy || (!text.trim() && !draft.length)} onClick=${send}><${Ic} n="send" s=${16}/>Gửi góp ý</button>
            </div>` : null}
        </div>
      </div>
      <aside class="side" aria-label="Góp ý">
        <div class="side-h"><h2>Góp ý cho V${ver}</h2></div>
        <p class="guide">Dừng ở khung cần sửa, gõ góp ý hoặc bấm Vẽ để khoanh chỗ cần sửa, rồi bấm Gửi. MagentX nhận được ngay.</p>
        <div class="who"><label for="cname">Tên của bạn</label><input id="cname" class="inp" value=${name} placeholder="VD: Lan, MoMo" maxlength="60" onInput=${e => { setName(e.target.value); ls.set('mxr.name', e.target.value); }}/></div>
        ${olderN ? html`<label class="old-t"><input type="checkbox" checked=${old} onChange=${e => setOld(e.target.checked)}/>Hiện cả ${olderN} góp ý cho bản trước</label>` : null}
        <div class="list">
          ${notes.length ? notes.map(n => html`<div key=${n.nid} class=${'n'+(act && act.nid === n.nid ? ' on' : '')}>
            <button type="button" class="n-main" onClick=${() => jump(n)}>
              <span class="n-top"><b class="n-tc">${tc(n.t)}</b><span>${n.name}</span>${n.ver !== ver ? html`<span class="vchip old">V${n.ver}</span>` : null}${n.d.length ? html`<span>có vẽ</span>` : null}</span>
              <span class="n-text">${n.text || 'Xem nét vẽ trên khung hình.'}</span>
            </button>
            <div class="n-foot">${n.ok ? html`<span class="done-tag">MagentX đã sửa</span>` : html`<span></span>`}${n.mine && !n.ok ? html`<button type="button" class="icon-btn bare" title="Xóa góp ý" aria-label=${'Xóa góp ý tại '+tc(n.t)} onClick=${() => del(n)}><${Ic} n="trash" s=${15}/></button>` : null}</div>
          </div>`) : html`<p class="empty">Chưa có góp ý nào cho bản này.</p>`}
        </div>
        <div class="dec">
          ${mineDec && decMode !== 'ask' && decMode !== 'fix'
            ? html`<div class=${'dec-st '+(mineDec.ok ? 'ok' : 'bad')}><b>${mineDec.name}</b> ${mineDec.ok ? 'đã đồng ý V'+ver : 'đã yêu cầu sửa V'+ver}, ${fT(mineDec.at)}${mineDec.text ? html`<br/>${mineDec.text}` : null}</div><div><button type="button" class="btn xs" onClick=${() => setDecMode('ask')}>Đổi phản hồi</button></div>`
            : decMode === 'fix'
            ? html`<h3>Cần sửa gì ở V${ver}?</h3><textarea class="inp" rows="3" value=${decText} placeholder="Tóm tắt các điểm cần sửa (các góp ý theo khung hình ở trên đã được gửi riêng)" onInput=${e => setDecText(e.target.value)}></textarea>
                <div class="row"><button type="button" class="btn" onClick=${() => setDecMode('ask')}>Quay lại</button><button type="button" class="btn danger" disabled=${busy || !decText.trim()} onClick=${() => decide(false)}>Gửi yêu cầu sửa</button></div>`
            : html`<h3>Phản hồi chung cho V${ver}</h3><div class="row"><button type="button" class="btn danger" onClick=${() => setDecMode('fix')}>Cần sửa</button><button type="button" class="btn ok" disabled=${busy} onClick=${() => decide(true)}><${Ic} n="check" s=${17}/>Đồng ý bản này</button></div>`}
        </div>
      </aside>
    </div>
  </div>`;
}
render(html`<${App}/>`, document.getElementById('app'));
})();
</script>
</body>
</html>
